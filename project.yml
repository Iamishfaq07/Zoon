# XcodeGen spec — a regeneration path for Zoon.xcodeproj.
#
# You do NOT need this to build Zoon. The checked-in Zoon.xcodeproj works as-is
# in Xcode 15 and later.
#
# It's here for one situation: the project file gets mangled by a merge and
# you'd rather regenerate it than resolve a pbxproj conflict by hand.
#
#   brew install xcodegen && xcodegen generate
#
# Keep this in sync with the real project when you change build settings.
#
# Tools/generate-pbxproj.py is the canonical project definition and CI fails
# when its deterministic output differs from the checked-in project. This
# XcodeGen spec is kept as a human-readable recovery path; update it alongside
# the generator whenever target membership or settings change.

name: Zoon
options:
  bundleIdPrefix: com.zoon
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Zoon:
    type: application
    platform: iOS
    sources:
      - path: Zoon
      - path: Shared
    dependencies:
      - target: ZoonWidgetExtension
        embed: true
      - target: ZoonWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoon.sleep
        CODE_SIGN_ENTITLEMENTS: Zoon/Zoon.entitlements
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Zoon
        INFOPLIST_KEY_NSMicrophoneUsageDescription: >-
          Zoon listens for sound patterns while Snore Check is running. Audio is
          analyzed live on this device and is never recorded or saved.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        INFOPLIST_KEY_NSHealthShareUsageDescription: >-
          Zoon reads your sleep, heart rate, HRV, respiratory rate, blood oxygen
          and wrist temperature to explain how you slept. Everything is processed
          on this device and never leaves it.

  ZoonWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ZoonWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoon.sleep.ZoonWidget
        CODE_SIGN_ENTITLEMENTS: ZoonWidget/ZoonWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ZoonWidget/Info.plist
        ENABLE_PREVIEWS: YES
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground

  # Modern single-target (WKApplication) watch app, embedded in Zoon.app at
  # build time — not the old WatchKit app-plus-extension pair. Overrides the
  # project-level iOS SDK/device family: those two settings are the whole
  # difference between "an iOS target" and "a watchOS target" here.
  ZoonWatch:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ZoonWatch
      - path: Shared
    dependencies:
      - target: ZoonWatchWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoon.sleep.watchkitapp
        CODE_SIGN_ENTITLEMENTS: ZoonWatch/ZoonWatch.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ZoonWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"

  ZoonWatchWidgetExtension:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ZoonWatchWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoon.sleep.watchkitapp.ZoonWatchWidget
        CODE_SIGN_ENTITLEMENTS: ZoonWatchWidget/ZoonWatchWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ZoonWatchWidget/Info.plist
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"

  # No TEST_HOST / BUNDLE_LOADER: a standalone "library" test bundle, not
  # hosted inside Zoon.app. It only touches Shared/'s pure algorithm code, so
  # it never needs the app process, HealthKit, or SwiftData to run.
  ZoonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ZoonTests
      - path: Shared
      - path: Zoon/Services/SleepSessionBuilder.swift
      - path: Zoon/Services/SnoreSignalAnalyzer.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoon.sleep.ZoonTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Zoon:
    build:
      targets:
        Zoon: all
        ZoonTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ZoonTests
    archive:
      config: Release
