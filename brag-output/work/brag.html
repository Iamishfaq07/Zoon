<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Zoon Brag</title>
<!-- /brag: 21 s, 1920x1080. Every frame is render(t); see brag-plan.md. -->
<link rel="stylesheet" href="fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #05060d; }
  body { font-family: 'Manrope', sans-serif; color: #f4f5fb; -webkit-font-smoothing: antialiased; }
  canvas, .layer { position: absolute; inset: 0; }
  .abs { position: absolute; }
  .center { position: absolute; left: 0; width: 100%; text-align: center; }
  .word { display: inline-block; }
  .shadow { text-shadow: 0 0 14px rgba(6,7,16,0.95), 0 0 30px rgba(6,7,16,0.8); }
  .hero { font: 800 128px/1 'Nunito'; letter-spacing: -0.02em; }
  .q { font: 700 72px/1.1 'Nunito'; color: rgba(244,245,251,0.82); }
  .headline { font: 800 84px/1.04 'Nunito'; letter-spacing: -0.02em; }
  .kicker { font: 700 22px/1 'Manrope'; letter-spacing: 0.28em; text-transform: uppercase; color: #9e8ff2; }
  .wordmark { font: 800 150px/1 'Nunito'; letter-spacing: 0.02em; }
  .tagline { font: 600 36px/1 'Manrope'; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(244,245,251,0.75); }
  .soon { font: 700 24px/1 'Manrope'; letter-spacing: 0.26em; text-transform: uppercase; color: rgba(244,245,251,0.7); }
  .small { font: 600 22px/1.3 'Manrope'; color: rgba(244,245,251,0.7); }
  .num { font-family: 'Nunito'; font-weight: 800; font-variant-numeric: tabular-nums; }
  .accent { background: linear-gradient(90deg, #c4b8ff, #7b61ff 55%, #3fd6a0); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
  .amber { color: #f5a25d; }
  .phone { position: absolute; width: 404px; height: 878px; border-radius: 66px; padding: 12px; transform-origin: 50% 0;
    background: linear-gradient(160deg, #2a2d3f, #0c0d14 40%, #1b1d29);
    box-shadow: 0 0 0 2px rgba(255,255,255,0.08) inset, 0 60px 120px rgba(0,0,0,0.55); }
  .phone img { display: block; width: 380px; height: 854px; object-fit: cover; object-position: top; border-radius: 55px; }
  .watch { position: absolute; width: 330px; height: 400px; border-radius: 92px; padding: 26px; transform-origin: 50% 0;
    background: linear-gradient(160deg, #3a3d4c, #111219 45%, #24262f);
    box-shadow: 0 0 0 2px rgba(255,255,255,0.07) inset, 0 50px 100px rgba(0,0,0,0.6); }
  .watch img { width: 278px; height: 348px; border-radius: 68px; object-fit: cover; display: block; }
  .crown { position: absolute; right: -16px; top: 110px; width: 18px; height: 70px; border-radius: 8px; background: linear-gradient(90deg,#2b2d38,#5a5d6c); }
  .bubble { position: absolute; max-width: 700px; padding: 22px 30px; border-radius: 30px; font: 600 32px/1.35 'Manrope'; }
  .me { background: linear-gradient(135deg, #7b61ff, #5a44d8); border-bottom-right-radius: 10px; }
  .zoon { background: rgba(26,28,52,0.94); box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset; border-bottom-left-radius: 10px; }
  .typing { position: absolute; display: flex; gap: 10px; padding: 28px 32px; border-radius: 30px; border-bottom-left-radius: 10px; background: rgba(26,28,52,0.94); }
  .typing i { width: 14px; height: 14px; border-radius: 50%; background: #9e8ff2; display: block; }
  .chip { position: absolute; display: inline-flex; gap: 12px; align-items: center; padding: 14px 22px; border-radius: 999px;
    font: 700 24px/1 'Manrope'; color: rgba(244,245,251,0.85); background: rgba(255,255,255,0.07); box-shadow: 0 0 0 1px rgba(255,255,255,0.1) inset; }
  #fade { position: absolute; inset: 0; background: #000; }
</style>
</head>
<body>
  <canvas id="sky"></canvas>
  <canvas id="fx"></canvas>

  <div class="layer" id="s1">
    <div class="center hero shadow" style="top:360px"><span id="s1a"></span></div>
    <div class="center q shadow" id="s1b" style="top:540px"></div>
  </div>

  <div class="layer" id="s2">
    <div class="abs wordmark shadow" id="s2w" style="left:160px;width:800px;text-align:center;top:560px"></div>
    <div class="abs tagline shadow" id="s2t" style="left:160px;width:800px;text-align:center;top:748px"></div>
    <div class="phone" id="s2p" style="left:1250px;top:101px"><img src="img/today.jpg"></div>
  </div>

  <div class="layer" id="s3">
    <div class="abs" style="left:180px;top:110px"><div class="kicker shadow">Last night</div><div class="headline shadow" id="s3h" style="margin-top:22px"></div></div>
    <div class="abs" id="s3n" style="left:1180px;top:118px;width:560px;text-align:right"><div class="num shadow" id="s3v" style="font-size:96px;line-height:1">0h 00m</div><div class="small shadow" style="margin-top:8px">asleep, stage by stage</div></div>
    <div class="abs small shadow" id="lW">Awake</div><div class="abs small shadow" id="lR">REM</div><div class="abs small shadow" id="lL">Light</div><div class="abs small shadow" id="lD">Deep</div>
    <div class="abs small shadow" id="h0">11:14 PM</div><div class="abs small shadow" id="h1">1:00 AM</div><div class="abs small shadow" id="h2">3:00 AM</div><div class="abs small shadow" id="h3">5:00 AM</div><div class="abs small shadow" id="h4">6:46 AM</div>
  </div>

  <div class="layer" id="s4">
    <div class="abs" style="left:180px;top:120px"><div class="kicker shadow">Coach</div><div class="headline shadow" id="s4h" style="margin-top:22px"></div></div>
    <div class="bubble me" id="b0" style="left:420px;top:390px">Why did I wake up so much?</div>
    <div class="typing" id="b1" style="left:180px;top:540px"><i></i><i></i><i></i></div>
    <div class="bubble zoon" id="b2" style="left:180px;top:540px"><span id="b2t"></span></div>
    <div class="chip" id="b3" style="left:180px;top:720px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9e8ff2" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h13"/></svg>A pattern in your own nights, not proof</div>
    <div class="phone" id="s4p" style="left:1300px;top:101px"><img src="img/coach.jpg"></div>
  </div>

  <div class="layer" id="s5">
    <div class="watch" id="s5w" style="left:795px;top:150px"><img src="img/w-tonight.jpg"><div class="crown"></div></div>
    <div class="center headline shadow" id="s5h" style="top:880px;font-size:76px"></div>
  </div>

  <div class="layer" id="s6">
    <img id="s6i" src="img/icon.png" style="position:absolute;left:840px;top:150px;width:240px;height:240px;border-radius:54px;box-shadow:0 30px 90px rgba(0,0,0,0.5),0 0 160px rgba(123,97,255,0.35)">
    <div class="center wordmark shadow" id="s6w" style="top:440px"></div>
    <div class="center tagline shadow" id="s6t" style="top:630px"></div>
    <div class="center soon shadow" id="s6s" style="top:740px"></div>
  </div>
  <div id="fade"></div>

<script>
const W = 1920, H = 1080, $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => 1 - Math.pow(1 - clamp(t), 3);
const easeIO = t => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const back = t => { t = clamp(t); return 1 + 2.5 * Math.pow(t - 1, 3) + 1.5 * Math.pow(t - 1, 2); };
const prog = (t, a, b) => clamp((t - a) / (b - a));
const vis = (t, a, b, fi = 0.5, fo = 0.5) => Math.min(ease(prog(t, a, a + fi)), 1 - easeIO(prog(t, b - fo, b)));
const hm = m => `${Math.floor(m / 60)}h ${String(Math.round(m % 60)).padStart(2, '0')}m`;

// Scene windows; neighbours overlap by 0.1 s so each cut dips through the sky.
const S = { 1: [0, 3.6], 2: [3.5, 7.0], 3: [6.9, 10.8], 4: [10.7, 15.6], 5: [15.5, 18.4], 6: [18.3, 21.6] };
const DUR = 21.0;
const dawnAt = t => easeIO(prog(t, 18.0, 20.0));

function words(el, text, accentFrom = -1, cls = 'accent') {
  el.innerHTML = text.split(' ').map((w, i) => `<span class="word${accentFrom >= 0 && i >= accentFrom ? ' ' + cls : ''}">${w}</span>`).join(' ');
  return Array.from(el.querySelectorAll('.word'));
}
function reveal(spans, t, start, step = 0.08, dur = 0.6, rise = 26) {
  spans.forEach((s, i) => {
    const p = ease(prog(t, start + i * step, start + i * step + dur));
    s.style.opacity = p; s.style.transform = `translateY(${(1 - p) * rise}px)`; s.style.filter = `blur(${(1 - p) * 8}px)`;
  });
}
function pop(el, t, start, from = 30, dur = 0.7) { const p = ease(prog(t, start, start + dur)); el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * from}px)`; }
const T = {
  s1b: words($('s1b'), 'So why are you tired?', 3),
  s2w: words($('s2w'), 'Zoon'), s2t: words($('s2t'), 'Sleep, understood.'),
  s3h: words($('s3h'), 'See the whole night.'),
  s4h: words($('s4h'), 'Ask Zoon.'),
  s5h: words($('s5h'), 'Tonight’s plan, on your wrist.', 3),
  s6w: words($('s6w'), 'Zoon'), s6t: words($('s6t'), 'Sleep, understood.'),
  s6s: words($('s6s'), 'No account. No server. Coming soon on the App Store.'),
};

// ---------- sky ----------
const sky = $('sky'), g = sky.getContext('2d'), fx = $('fx'), c = fx.getContext('2d');
sky.width = fx.width = W; sky.height = fx.height = H;
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const stars = Array.from({ length: 420 }, () => ({ x: rnd() * W, y: rnd() * (H + 220), r: 0.4 + Math.pow(rnd(), 3) * 2.1, tw: 0.6 + rnd() * 2.2, ph: rnd() * 6.28, depth: 0.2 + rnd() * 0.8 }));
const craters = Array.from({ length: 34 }, () => ({ a: rnd() * 6.283, d: Math.sqrt(rnd()) * 0.9, r: 0.025 + Math.pow(rnd(), 2) * 0.1 }));
const maria = Array.from({ length: 7 }, () => ({ a: rnd() * 6.283, d: rnd() * 0.6, r: 0.18 + rnd() * 0.22 }));
function mix(a, b, k) { const pa = a.match(/\w\w/g).map(h => parseInt(h, 16)), pb = b.match(/\w\w/g).map(h => parseInt(h, 16)); return `rgb(${pa.map((v, i) => Math.round(v + (pb[i] - v) * k)).join(',')})`; }
function zones() {
  const z = [];
  document.querySelectorAll('.shadow').forEach(el => { const r = el.getBoundingClientRect(); if (r.width && r.height && el.closest('.layer').style.display !== 'none') z.push([r.left - 40, r.top - 30, r.right + 40, r.bottom + 30]); });
  return z;
}
function drawSky(t, zs) {
  const d = dawnAt(t), bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, mix('0e1128', '1b2352', d)); bg.addColorStop(0.55, mix('0a0c1d', '3a2d5a', d)); bg.addColorStop(1, mix('05060d', 'c9765a', d));
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  for (const [x, y, r, col] of [[W * 0.27 + Math.sin(t * 0.2) * 120, H * 0.28, 700, 'rgba(123,97,255,0.13)'], [W * 0.78 + Math.cos(t * 0.15) * 140, H * 0.76, 800, 'rgba(63,120,214,0.10)']]) {
    const rg = g.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = rg; g.fillRect(0, 0, W, H);
  }
  if (d > 0) { const hg = g.createRadialGradient(W / 2, H * 1.05, 0, W / 2, H * 1.05, H * 0.95); hg.addColorStop(0, `rgba(255,178,120,${0.55 * d})`); hg.addColorStop(0.5, `rgba(240,120,110,${0.18 * d})`); hg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = hg; g.fillRect(0, 0, W, H); }
  for (const s of stars) {
    const y = ((s.y - t * 10 * s.depth) % (H + 220) + (H + 220)) % (H + 220) - 110;
    if (zs.some(z => s.x > z[0] && s.x < z[2] && y > z[1] && y < z[3])) continue;
    g.globalAlpha = (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.tw + s.ph))) * (0.4 + 0.6 * s.depth) * (1 - 0.8 * d) * (1 - 0.7 * d * y / H);
    g.fillStyle = '#e8ecff'; g.beginPath(); g.arc(s.x, y, s.r, 0, 6.283); g.fill();
  }
  g.globalAlpha = 1;
}
function glow(x, y, r, col) { const rg = c.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = rg; c.beginPath(); c.arc(x, y, r, 0, 6.283); c.fill(); }
function rr(x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function moon(cx, cy, r, lit, a) {
  c.save(); c.globalAlpha = a; glow(cx, cy, r * 2.4, 'rgba(190,186,255,0.22)');
  c.beginPath(); c.arc(cx, cy, r, 0, 6.283); c.clip();
  const base = c.createRadialGradient(cx - r * 0.4, cy - r * 0.4, r * 0.1, cx, cy, r * 1.1); base.addColorStop(0, '#f7f7fb'); base.addColorStop(1, '#a9afc2');
  c.fillStyle = base; c.fillRect(cx - r, cy - r, r * 2, r * 2);
  for (const m of maria) { const x = cx + Math.cos(m.a) * m.d * r, y = cy + Math.sin(m.a) * m.d * r, mg = c.createRadialGradient(x, y, 0, x, y, m.r * r); mg.addColorStop(0, 'rgba(110,116,140,0.38)'); mg.addColorStop(1, 'rgba(110,116,140,0)'); c.fillStyle = mg; c.fillRect(cx - r, cy - r, r * 2, r * 2); }
  for (const k of craters) { const x = cx + Math.cos(k.a) * k.d * r, y = cy + Math.sin(k.a) * k.d * r, cr = k.r * r, cg = c.createRadialGradient(x + cr * 0.25, y + cr * 0.25, 0, x, y, cr); cg.addColorStop(0, 'rgba(118,124,148,0.30)'); cg.addColorStop(1, 'rgba(118,124,148,0.05)'); c.fillStyle = cg; c.beginPath(); c.arc(x, y, cr, 0, 6.283); c.fill(); c.strokeStyle = 'rgba(255,255,255,0.22)'; c.lineWidth = Math.max(1, cr * 0.14); c.beginPath(); c.arc(x, y, cr, 2.4, 4.4); c.stroke(); }
  c.shadowColor = 'rgba(13,16,38,1)'; c.shadowBlur = r * 0.3; c.fillStyle = 'rgba(13,16,38,0.955)';
  c.beginPath(); c.arc(cx + r * lerp(0.35, 1.75, lit), cy - r * 0.1, r * 1.02, 0, 6.283); c.fill(); c.restore();
}
const NIGHT = [['L',12],['D',38],['L',14],['R',9],['L',18],['D',30],['L',12],['W',4],['L',16],['R',19],['L',24],['D',16],['L',22],['R',24],['W',5],['L',28],['R',27],['L',22],['W',3],['L',26],['R',31],['L',20],['W',4],['L',8]];
const TOTAL = NIGHT.reduce((s, x) => s + x[1], 0), LANE = { W: 0, R: 1, L: 2, D: 3 }, LCOL = { W: '#f5a25d', R: '#c4a6ff', L: '#62b3ff', D: '#6a52e0' };
const CH = [330, 430, 1640, 850];
function hypnogram(p, a) {
  const [x0, y0, x1, y1] = CH, lh = (y1 - y0) / 4, bw = x1 - x0, edge = x0 + bw * p;
  c.save(); c.globalAlpha = a; c.strokeStyle = 'rgba(255,255,255,0.07)'; c.lineWidth = 1;
  for (let i = 0; i <= 4; i++) { c.beginPath(); c.moveTo(x0, y0 + i * lh); c.lineTo(x1, y0 + i * lh); c.stroke(); }
  c.beginPath(); c.rect(x0 - 10, y0 - 20, edge - x0 + 10, y1 - y0 + 40); c.clip();
  let acc = 0, prev = null;
  for (const [st, m] of NIGHT) {
    const xa = x0 + bw * acc / TOTAL, xb = x0 + bw * (acc + m) / TOTAL, yc = y0 + lh * (LANE[st] + 0.5), bh = lh * 0.56;
    if (prev) { c.strokeStyle = 'rgba(255,255,255,0.22)'; c.lineWidth = 2; c.beginPath(); c.moveTo(xa, y0 + lh * (LANE[prev] + 0.5)); c.lineTo(xa, yc); c.stroke(); }
    const gr = c.createLinearGradient(0, yc - bh / 2, 0, yc + bh / 2); gr.addColorStop(0, LCOL[st]); gr.addColorStop(1, LCOL[st] + 'aa');
    c.fillStyle = gr; c.shadowColor = LCOL[st]; c.shadowBlur = 18; rr(xa + 1, yc - bh / 2, Math.max(4, xb - xa - 2), bh, 9); c.fill(); c.shadowBlur = 0;
    acc += m; prev = st;
  }
  c.restore();
  if (p > 0 && p < 1) { c.save(); c.globalAlpha = a; c.strokeStyle = '#e6e0ff'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(edge, y0 - 16); c.lineTo(edge, y1 + 16); c.stroke(); glow(edge, y0 - 16, 26, 'rgba(230,224,255,0.7)'); c.restore(); }
}
(function placeChart() {
  const [x0, y0, x1, y1] = CH, lh = (y1 - y0) / 4;
  ['lW', 'lR', 'lL', 'lD'].forEach((id, i) => { const el = $(id); el.style.left = (x0 - 150) + 'px'; el.style.top = (y0 + lh * (i + 0.5) - 14) + 'px'; el.style.color = LCOL['WRLD'[i]]; });
  [0, 106, 226, 346, 452].forEach((m, i) => { const el = $('h' + i); el.style.left = (x0 + (x1 - x0) * m / 452 - 50) + 'px'; el.style.top = (y1 + 26) + 'px'; el.style.width = '100px'; el.style.textAlign = 'center'; el.style.fontSize = '20px'; });
})();

function layer(id, o) { const el = $(id); el.style.opacity = o; el.style.display = o <= 0.001 ? 'none' : 'block'; }
function rise(el, t, start, from = 200, base = 1) { const p = ease(prog(t, start, start + 1.1)); el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * from + Math.sin(t * 0.9) * 8}px) scale(${base * (0.94 + 0.06 * p)})`; }
const ANSWER = '3 wakes after 2 AM, more common after late caffeine.';

window.render = function (t) {
  c.clearRect(0, 0, W, H);
  const o = {}; for (const k in S) { o[k] = vis(t, S[k][0], S[k][1], k == 1 ? 0.1 : 0.5, 0.5); layer('s' + k, o[k]); }

  if (o[1] > 0) {
    const n = 452 * easeIO(prog(t, 0.15, 0.9));
    $('s1a').innerHTML = `You slept <span class="num">${hm(n)}</span>.`;
    pop($('s1a'), t, 0.05, 20, 0.5);
    reveal(T.s1b, t, 1.15, 0.1, 0.55, 22);
  }
  if (o[2] > 0) {
    const l = t - S[2][0], r1 = easeIO(prog(l, 0, 1.4));
    moon(560, 360 + (1 - r1) * 80, 130 * (0.86 + 0.14 * r1), 0.2 + 0.35 * r1, o[2]);
    reveal(T.s2w, t, S[2][0] + 0.5, 0.1, 0.8, 30); reveal(T.s2t, t, S[2][0] + 1.0, 0.1, 0.7, 18);
    rise($('s2p'), t, S[2][0] + 0.7, 220, 0.94);
  }
  if (o[3] > 0) {
    const l = t - S[3][0], p = easeIO(prog(l, 0.4, 2.9));
    hypnogram(p, o[3]); reveal(T.s3h, t, S[3][0] + 0.15, 0.08);
    $('s3v').textContent = hm(452 * p); pop($('s3n'), t, S[3][0] + 0.3);
    ['lW', 'lR', 'lL', 'lD', 'h0', 'h1', 'h2', 'h3', 'h4'].forEach((id, i) => pop($(id), t, S[3][0] + 0.3 + i * 0.04, 12));
  }
  if (o[4] > 0) {
    const l = t - S[4][0];
    reveal(T.s4h, t, S[4][0] + 0.15, 0.1);
    pop($('b0'), t, S[4][0] + 0.5, 30);
    $('b1').style.opacity = (l > 0.95 && l < 1.35) ? 1 : 0;
    $('b1').querySelectorAll('i').forEach((d, i) => d.style.opacity = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 10 - i * 0.9)));
    $('b2').style.opacity = l >= 1.35 ? 1 : 0;
    $('b2t').textContent = ANSWER.slice(0, Math.floor(ANSWER.length * clamp((l - 1.35) / 0.8)));
    pop($('b3'), t, S[4][0] + 2.3, 16);
    rise($('s4p'), t, S[4][0] + 0.3, 220, 0.94);
  }
  if (o[5] > 0) {
    const l = t - S[5][0], k = back(prog(l, 0.1, 1.0));
    glow(795 + 165, 150 + 200 * 1.5, 480 * clamp(k), `rgba(196,184,255,${0.32 * o[5]})`);
    const w = $('s5w'); w.style.opacity = clamp(k); w.style.transform = `translateY(${(1 - k) * 160 + Math.sin(t * 0.9) * 8}px) scale(${1.5 * (0.85 + 0.15 * clamp(k))})`;
    reveal(T.s5h, t, S[5][0] + 0.35, 0.08, 0.6);
  }
  if (o[6] > 0) {
