<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Zoon — launch film (90 s, 9:16)</title>
<!--
  The 90-second launch film. A WebGL world (launch90/engine.js) and a 2D
  typography layer above it (launch90/type.js), both posed by render(t) at a
  fixed clock, so every render is identical. The phone and watch screens are
  real captures of the app in its demo mode (screens/), cut into their own
  cards. window.CUES and window.MUSIC drive the score (launch90-score.py).
  Render with launch90-render.js.
-->
<link rel="stylesheet" href="fonts.css">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  canvas { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="type"></canvas>
<script type="module" src="launch90/film.js"></script>
</body>
</html>
