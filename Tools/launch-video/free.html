<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Zoon Free</title>
<!--
  The 30-second companion to the showreel: every premium feature is free,
  and everything happens on the iPhone. Drawn with reelkit.js on the same
  clock-driven canvas; render with render100.js (FILM=free.html), score with
  score100.py (CUES=cues-free.json). Every claim here is true of the app as
  built: no in-app purchases, no subscription, no ads, no account, and no
  networking code; the coach runs on Apple's on-device model.
-->
<link rel="stylesheet" href="fonts.css">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #030409; }
  canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>window.REEL_DURATION = 30;</script>
<script src="reelkit.js"></script>
<script>
'use strict';

// ---------- pieces ----------
function padlock(x, y, s, open, o = {}) {
  g.save(); g.translate(x, y); g.scale(s, s); g.globalAlpha *= (o.a ?? 1);
  const lift = open * 64, rot = -open * 0.55;
  g.save(); g.translate(62, -40 - lift); g.rotate(rot); g.translate(-62, 0);
  g.strokeStyle = o.shackle || '#cfd2e6'; g.lineWidth = 28;
  g.beginPath(); g.moveTo(-62, 0); g.lineTo(-62, -60); g.arc(0, -60, 62, Math.PI, 0); g.lineTo(62, 0); g.stroke(); g.restore();
  const gr = g.createLinearGradient(0, -60, 0, 130); gr.addColorStop(0, o.top || '#a896ff'); gr.addColorStop(1, o.bottom || '#5a44d8');
  g.shadowColor = o.glow || 'rgba(123,97,255,0.8)'; g.shadowBlur = o.blur ?? 40;
  g.fillStyle = gr; g.beginPath(); g.roundRect(-120, -60, 240, 200, 40); g.fill(); g.shadowColor = 'transparent';
  g.fillStyle = '#1a1540'; g.beginPath(); g.arc(0, 20, 20, 0, 7); g.fill(); g.fillRect(-8, 20, 16, 50);
  g.restore();
}
function stamp(x, y, k, label = 'FREE', size = 54) {
  if (k <= 0) return;
  const sc = lerp(2.4, 1, eOut5(k));
  g.save(); g.translate(x, y); g.rotate(-0.12); g.scale(sc, sc); g.globalAlpha *= clamp(k * 3);
  const w = measure(label, size, 900, HEAD, 6) + 44, h = size + 26;
  g.fillStyle = 'rgba(63,214,160,0.16)'; g.strokeStyle = C.calm; g.lineWidth = 5;
  g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, 16); g.fill(); g.stroke();
  text(label, 3, size * 0.36, { size, weight: 900, align: 'center', color: C.calm, ls: 6 });
  g.restore();
}
function lockup(t, t0, cx, cy) {
  // the app-icon crescent grows from a point, is carved, and settles beside the name
  const settle = eInOut(seg(t, t0 + 0.55, t0 + 1.2));
  const r = lerp(lerp(7, 240, eExpo(seg(t, t0, t0 + 0.55))), 170, settle);
  const mx = lerp(W / 2, vh(cx - 300, W / 2), settle), my = lerp(H / 2, vh(cy, cy - 170), settle);
  crescent(mx, my, r, eInOut(seg(t, t0 + 0.2, t0 + 0.55)), 1, 1 + 1.6 * Math.exp(-Math.max(0, t - t0 - 0.55) * 3.5) * (t > t0 + 0.55));
  shock(W / 2, H / 2, t, t0 + 0.55, 240, 1700); burst(W / 2, H / 2, t, t0 + 0.55, 140, 1300, '#e6e0ff', 17);
  kline('Zoon', vh(cx - 100, W / 2), vh(cy + 78, cy + 185), t, t0 + 0.65, { align: vh('left', 'center'), size: vh(240, 210), weight: 900, ls: -3, stagger: 0.06, dur: 0.9 });
}

// ---- A  Hook: the paywall breaks (0 - 4.8) ----
const SA = { a: 0, b: 4.8 };
cue(0.3, 'tick', 0.5); cue(0.35, 'click', 0.4); cue(0.95, 'click', 0.4); cue(1.45, 'click', 0.45);
cue(2.72, 'riser', 0.8, 0, { dur: 0.63 }); cue(2.8, 'ticks', 0.5, 0.3, { dur: 0.5, n: 7 });
cue(3.35, 'snap', 1.0, 0.3); cue(3.4, 'shimmer', 0.6, 0.3, { dur: 1 }); cue(3.7, 'boom', 1.1); cue(4.55, 'whoosh', 0.9, 0.6);
function sceneA(t) {
  g.fillStyle = '#030409'; g.fillRect(0, 0, W, H);
  stars(t, 0.5 * seg(t, 0.2, 1.2));
  const lx = vh(160, 80);
  kline('Premium sleep features', lx, vh(390, 520), t, 0.3, { size: vh(84, 76), out: 3.15 });
  kline('usually mean', lx, vh(485, 612), t, 0.95, { size: vh(84, 76), out: 3.18 });
  kline('a subscription.', lx, vh(580, 704), t, 1.45, { size: vh(84, 76), out: 3.21, color: gradText('#ffb0b0', '#ff7a7a') });
  // the paywall
  const px = vh(1420, W / 2), py = vh(560, 1180), s = vh(1.35, 1.6);
  const rattle = t > 2.8 && t < 3.35 ? Math.sin(t * 70) * 7 * seg(t, 2.8, 3.1) : 0;
  const open = eBack(seg(t, 3.35, 3.55)), gone = seg(t, 3.5, 3.75);
  const pk = eBack(seg(t, 0.6, 1.1));
  if (pk > 0 && gone < 1) {
    g.save(); g.globalAlpha = 1 - gone; g.translate(px + rattle, py); g.scale(pk * (1 + gone * 0.4), pk * (1 + gone * 0.4)); g.translate(-px, -py);
    // the price tag on its string
    const sw = Math.sin(t * 3) * 0.1 + rattle * 0.02;
    g.save(); g.translate(px + 110 * s, py + 110 * s); g.rotate(0.25 + sw);
    g.strokeStyle = 'rgba(255,255,255,0.4)'; g.lineWidth = 2; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 44 * s); g.stroke();
    g.fillStyle = '#ffb454'; g.beginPath(); g.roundRect(-70 * s, 44 * s, 140 * s, 60 * s, 12 * s); g.fill();
    text('PREMIUM', 0, 83 * s, { size: 20 * s, weight: 800, fam: BODY, ls: 3, align: 'center', color: '#2a1a00' });
    g.restore();
    padlock(px, py, s, open, { top: '#a3a8bf', bottom: '#555a72', glow: 'rgba(0,0,0,0.6)', shackle: '#b9bdd0' });
    g.restore();
  }
  burst(px, py, t, 3.5, 90, 1000, '#ffcf8a', 5);
  kicker('ON ZOON', W / 2, vh(430, 800), t, 3.55, { align: 'center', out: 4.5 });
  kline("It's all free.", W / 2, vh(610, 960), t, 3.7, { size: vh(160, 140), align: 'center', ls: -4, out: 4.52, color: gradText('#ffffff', C.lilac) });
}

// ---- B  Real screens, each stamped FREE (4.8 - 10.8) ----
const SB = { a: 4.8, b: 10.8 };
const SCR = [
  ['coach', 'AI Coach', 'Apple Intelligence, on your iPhone', C.lilac],
  ['sleepDetail', 'Sleep stages', 'Every minute, sorted', C.sky],
  ['today', 'Sleep shortfall', 'What you owe, and the way back', C.amber],
  ['sleepDetail-heart', 'Heart at night', 'Your overnight low, and when', C.heart],
  ['trends-forYourAge', 'For your age', 'Heart rate, HRV, VO₂ max', C.pink],
  ['snoreCheck', 'Snore Check', 'Audio is never saved', C.sky],
  ['soundscapes', 'Sleep sounds', 'Noise, rain and nature, on the device', C.calm],
  ['bodyClock', 'Body clock', 'When focus peaks, when to wind down', C.amber]
];
const BT = { t0: 4.8, step: 0.75 };
SCR.forEach((_, i) => { const tt = BT.t0 + i * BT.step; cue(tt, i === 0 ? 'hit' : 'cut', i === 0 ? 1 : 0.8, i % 2 ? 0.5 : -0.5); cue(tt + 0.25, 'hit', 0.7, i % 2 ? -0.3 : 0.3); });
cue(10.55, 'whoosh', 0.8, 0);
function sceneB(t) {
  bg(t, 0.5);
  const i = Math.min(SCR.length - 1, Math.floor((t - BT.t0) / BT.step)), u = t - BT.t0 - i * BT.step, t0 = BT.t0 + i * BT.step;
  const [name, label, sub, col] = SCR[i], side = i % 2 ? 1 : -1;
  glowAt(W / 2, H / 2, 1100, col + '30');
  const k = eExpo(clamp(u / 0.3)), exit = i === SCR.length - 1 ? eIn(seg(t, 10.4, 10.8)) : 0;
  const px = vh(side < 0 ? 1320 : 600, W / 2) + (1 - k) * 700 * -side;
  phone(name, px, vh(560, 1190) + (1 - k) * 40, vh(900, 1080), { yaw: side * lerp(0.9, 0.22, k), glowCol: col + '44', a: 1 - exit });
  const lx = vh(side < 0 ? 160 : 1760, W / 2), al = vh(side < 0 ? 'left' : 'right', 'center');
  g.save(); g.globalAlpha = 1 - exit;
  kline(label, lx, vh(610, 450), t, t0, { size: vh(110, 104), align: al, stagger: 0.012, dur: 0.4, ls: -3 });
  rise(sub, lx, vh(672, 515), t, t0 + 0.06, { align: al, size: 30 });
  stamp(vh(side < 0 ? 280 : 1640, W / 2), vh(470, 305), seg(t, t0 + 0.25, t0 + 0.45));
  g.restore();
}

// ---- C  All twelve, all free (10.8 - 13.75) ----
const SCC = { a: 10.8, b: 13.75 };
const FEATS = [
  ['AI Coach', C.lilac], ['Sleep stages', C.sky], ['Sleep shortfall', C.amber], ['Heart & HRV at night', C.heart],
  ['For your age', C.pink], ['Sleep Autopilot', '#9d8cff'], ['Snore Check', C.sky], ['Sleep sounds', C.calm],
  ['Guided breathing', C.lilac], ['Body clock', C.amber], ['Trends & monthly recap', C.sky], ['Watch app & widgets', C.calm]
];
FEATS.forEach((_, i) => { cue(10.95 + i * 0.08, 'pop', 0.35, (i % (V ? 2 : 4)) / (V ? 1 : 3) - 0.5); cue(11.9 + i * 0.05, 'chime', 0.3, 0); });
cue(12.3, 'click', 0.4); cue(13.2, 'stretch', 0.8, 0, { dur: 0.5 });
function tilePos(i) {
  if (V) { const c = i % 2, r = Math.floor(i / 2); return [303 + c * 474, 465 + r * 154]; }
  const c = i % 4, r = Math.floor(i / 4); return [354 + c * 404, 400 + r * 144];
}
function sceneC(t) {
  bg(t, 0.6);
  const conv = eIn(seg(t, 13.2, 13.7)), tx = W / 2, ty = vh(560, 1170), ha = 1 - seg(t, 13.1, 13.35);
  g.save(); g.globalAlpha = ha;
  kicker('ALL INCLUDED', vh(W / 2, 80), vh(170, 250), t, 10.85, { align: vh('center', 'left'), color: C.calm });
  kline('Every premium feature.', vh(W / 2, 80), vh(258, 345), t, 10.9, { size: vh(76, 72), align: vh('center', 'left') });
  if (V) {
    rise('No subscription  ·  No trial', W / 2, 1400, t, 12.3, { align: 'center', size: 34, color: C.ink });
    rise('No in-app purchases', W / 2, 1455, t, 12.4, { align: 'center', size: 34, color: C.ink });
  } else rise('No subscription  ·  No trial  ·  No in-app purchases', W / 2, 875, t, 12.3, { align: 'center', size: 32, color: C.ink });
  g.restore();
  const tw = vh(380, 450), th = vh(120, 130), fs = vh(30, 32);
  FEATS.forEach(([name, col], i) => {
    const k = eBack(seg(t, 10.95 + i * 0.08, 11.3 + i * 0.08)); if (k <= 0) return;
    let [x, y] = tilePos(i);
    x = lerp(x, tx, conv); y = lerp(y, ty, conv);
    const sc = k * lerp(1, 0.08, conv);
    g.save(); g.translate(x, y); g.scale(sc, sc); g.globalAlpha = clamp(k * 2) * (1 - conv * 0.6);
    g.fillStyle = 'rgba(16,18,40,0.92)'; g.beginPath(); g.roundRect(-tw / 2, -th / 2, tw, th, 24); g.fill();
    g.strokeStyle = col; g.globalAlpha *= 0.5; g.lineWidth = 1.5; g.stroke(); g.globalAlpha /= 0.5;
    glowAt(-tw / 2 + 34, 0, 26, col + '88'); g.fillStyle = col; g.beginPath(); g.arc(-tw / 2 + 34, 0, 8, 0, 7); g.fill();
    text(name, -tw / 2 + 58, fs * 0.35, { size: fs, weight: 800 });
    const fk = eBack(seg(t, 11.9 + i * 0.05, 12.15 + i * 0.05));
    if (fk > 0) pill(tw / 2 - 18, -th / 2 + 2, 'FREE', C.calm, fk, lerp(0.6, 0.95, fk), 'right');
    g.restore();
  });
}

// ---- D  On device: nothing gets out (13.75 - 23.75) ----
const SD = { a: 13.75, b: 23.75 };
const PHN = V ? { x: 540, y: 1170, w: 500, h: 1000, r: 84 } : { x: 1340, y: 560, w: 330, h: 680, r: 58 };
const DATA = ['Sleep stages', 'Heart & HRV', 'Your journal', 'Snore audio', 'AI Coach'];
const PARTS = (() => { const r = rng(44), p = []; for (let i = 0; i < 40; i++) { const a = r() * Math.PI * 2, v = 160 + r() * 260; p.push({ vx: Math.cos(a) * v, vy: Math.sin(a) * v, c: [C.lilac, C.sky, C.calm, C.pink, C.amber][i % 5], s: 3 + r() * 3 }); } return p; })();
const CLOUD = V ? { x: 930, y: 575 } : { x: 1700, y: 205 };
cue(13.8, 'draw', 0.7, 0.4, { dur: 0.7 }); DATA.forEach((_, i) => cue(14.5 + i * 0.3, 'pop', 0.5, 0.4));
cue(16.6, 'pop', 0.5, 0.7); cue(16.8, 'data', 0.45, 0.6, { dur: 0.7 }); cue(17.55, 'snap', 1.1, 0.7);
cue(18.0, 'hit', 1.0, -0.4); cue(18.45, 'hit', 1.0, -0.4); cue(18.9, 'hit', 1.05, -0.4);
cue(19.7, 'shimmer', 0.7, 0.3, { dur: 1.4 }); cue(19.72, 'land', 0.6, 0.3); cue(20.45, 'click', 0.4);
cue(22.3, 'rev', 0.6, 0.3, { dur: 0.45 }); cue(22.75, 'latch', 1.2, 0.3); cue(23.2, 'stretch', 0.7, 0, { dur: 0.5 });
const tri = u => 1 - Math.abs((((u % 2) + 2) % 2) - 1);
function sceneD(t) {
  bg(t, 0.6);
  const out = eIn(seg(t, 23.2, 23.75)), P = PHN;
  g.save();
  if (out > 0) { g.translate(P.x, P.y); g.scale(1 - out, 1 - out); g.translate(-P.x, -P.y); }
  // the iPhone, drawn as an outline that closes on itself
  const dk = eInOut(seg(t, 13.75, 14.45)), per = 2 * (P.w + P.h);
  g.save(); g.strokeStyle = C.lilac; g.lineWidth = 4; g.shadowColor = 'rgba(196,184,255,0.8)'; g.shadowBlur = 18;
  g.setLineDash([per * dk, per]); g.beginPath(); g.roundRect(P.x - P.w / 2, P.y - P.h / 2, P.w, P.h, P.r); g.stroke(); g.setLineDash([]);
  g.globalAlpha = seg(t, 14.3, 14.6); g.fillStyle = 'rgba(196,184,255,0.9)'; g.beginPath(); g.roundRect(P.x - P.w * 0.14, P.y - P.h / 2 + 22, P.w * 0.28, P.w * 0.07, P.w * 0.035); g.fill();
  g.restore();
  glowAt(P.x, P.y, P.h * 0.7, 'rgba(123,97,255,0.14)', seg(t, 14, 14.6));
  // data bouncing inside it, and nowhere else
  const pa = seg(t, 13.9, 14.4), toOrb = eInOut(seg(t, 19.7, 20.6));
  const L0 = P.x - P.w / 2 + 16, T0 = P.y - P.h / 2 + 16, Wb = P.w - 32, Hb = P.h - 32;
  PARTS.forEach((q, i) => {
    const u = t - 13.9;
    let x = L0 + tri(((P.x - L0) + q.vx * u) / Wb) * Wb, y = T0 + tri(((P.y - T0) + q.vy * u) / Hb) * Hb;
    const oa = i / PARTS.length * Math.PI * 2 + t * 0.9, orr = vh(95, 140) + (i % 4) * vh(14, 20);
    x = lerp(x, P.x + Math.cos(oa) * orr, toOrb); y = lerp(y, P.y + Math.sin(oa) * orr, toOrb);
    g.globalAlpha = pa * 0.9; g.fillStyle = q.c; g.beginPath(); g.arc(x, y, q.s, 0, 7); g.fill();
  });
  g.globalAlpha = 1;
  const chipA = 1 - seg(t, 19.3, 19.6);
  DATA.forEach((d, i) => {
    const k = eBack(seg(t, 14.5 + i * 0.3, 14.85 + i * 0.3)); if (k <= 0 || chipA <= 0) return;
    const fs = vh(22, 28), y = P.y - vh(128, 180) + i * vh(64, 90), w = measure(d, fs, 800, BODY) + 56;
    g.save(); g.translate(P.x, y); g.scale(k, k); g.globalAlpha = chipA * clamp(k * 2);
    g.fillStyle = 'rgba(16,18,40,0.92)'; g.beginPath(); g.roundRect(-w / 2, -fs, w, fs * 2, fs); g.fill();
    g.fillStyle = PARTS[i].c; g.beginPath(); g.arc(-w / 2 + 22, 0, 6, 0, 7); g.fill();
    text(d, -w / 2 + 38, fs * 0.36, { size: fs, weight: 800, fam: BODY }); g.restore();
  });
  // the cloud tries to take it; the link is cut
  const ca = seg(t, 16.55, 16.9) * (1 - seg(t, 17.6, 18.2)), cy2 = CLOUD.y + eIn(seg(t, 17.6, 18.2)) * 60;
  const ax = P.x + P.w / 2 - vh(40, 60), ay = P.y - P.h / 2 + vh(24, 30), bx = CLOUD.x - vh(10, 20), by = cy2 + 40;
  if (t > 16.6 && t < 18.3) {
    const brk = seg(t, 17.55, 17.95), mx = (ax + bx) / 2, my = (ay + by) / 2, link = eOut(seg(t, 16.6, 16.9));
    g.save(); g.setLineDash([10, 12]); g.lineDashOffset = -t * 60; g.lineWidth = 3; g.strokeStyle = `rgba(196,184,255,${0.7 * (1 - brk)})`;
    if (t < 17.55) { g.beginPath(); g.moveTo(ax, ay); g.lineTo(lerp(ax, bx, link), lerp(ay, by, link)); g.stroke(); }
    else {
      g.beginPath(); g.moveTo(ax, ay); g.lineTo(lerp(mx, ax, eOut(brk) * 0.8), lerp(my, ay, eOut(brk) * 0.8)); g.stroke();
      g.beginPath(); g.moveTo(bx, by); g.lineTo(lerp(mx, bx, eOut(brk) * 0.8), lerp(my, by, eOut(brk) * 0.8)); g.stroke();
    }
    g.restore();
    for (let k = 0; k < 4 && t < 17.55; k++) { const p = ((t - 16.8) * 1.4 + k / 4) % 1; if (t > 16.8 && p < 0.48) dot(lerp(ax, bx, p), lerp(ay, by, p), 4, C.lilac, 'rgba(196,184,255,0.4)'); }
    burst(mx, my, t, 17.55, 40, 500, '#ffb27a', 13);
  }
  if (ca > 0) {
    g.save(); g.globalAlpha = ca; g.fillStyle = 'rgba(255,255,255,0.2)';
    for (const [x, y, r] of [[-44, 10, 38], [4, -16, 54], [50, 12, 34]]) { g.beginPath(); g.arc(CLOUD.x + x, cy2 + y, r, 0, 7); g.fill(); }
    g.beginPath(); g.roundRect(CLOUD.x - 82, cy2 + 6, 166, 42, 21); g.fill(); g.restore();
  }
  // the AI, inside the phone
  const ok = eBack(seg(t, 19.7, 20.15)), fade = 1 - seg(t, 22.35, 22.7);
  if (ok > 0 && fade > 0) {
    const r = vh(56, 80) * ok * (1 + 0.04 * Math.sin(t * 6));
    g.save(); g.globalAlpha = fade;
    glowAt(P.x, P.y, r * 4, 'rgba(160,140,255,0.45)');
    const gr = g.createRadialGradient(P.x - r * 0.3, P.y - r * 0.3, r * 0.1, P.x, P.y, r);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.45, '#c4b8ff'); gr.addColorStop(1, '#5a44d8');
    g.fillStyle = gr; g.beginPath(); g.arc(P.x, P.y, r, 0, 7); g.fill();
    g.strokeStyle = 'rgba(230,224,255,0.75)'; g.lineWidth = 3; g.lineCap = 'round';
    for (let k = 0; k < 2; k++) { const rr = r * (1.4 + k * 0.3), a0 = t * (1.3 - k * 0.6) + k * 2; g.beginPath(); g.arc(P.x, P.y, rr, a0, a0 + Math.PI * 0.8); g.stroke(); }
    text('APPLE INTELLIGENCE', P.x, P.y + r + vh(118, 160), { size: vh(14, 18), weight: 800, fam: BODY, ls: 4, align: 'center', color: C.lilac, a: seg(t, 20.0, 20.4) });
    g.restore();
  }
  // and then it is locked
  const lk = eBack(seg(t, 22.3, 22.6));
  if (lk > 0) {
    const drop = (1 - lk) * -220, close = eBack(seg(t, 22.55, 22.75));
    padlock(P.x, P.y + drop, vh(0.62, 0.9), 1 - close, { a: clamp(lk * 2), blur: 40 + 70 * Math.exp(-Math.max(0, t - 22.75) * 3) * (t > 22.75) });
    shock(P.x, P.y, t, 22.75, 120, 900);
  }
  g.restore();
  // the words, on the left (or on top, on a phone)
  const tx = vh(160, 80);
  kicker('ON DEVICE', tx, vh(330, 260), t, 13.85, { out: 17.7 });
  kline('Everything stays', tx, vh(430, 360), t, 13.95, { size: 84, out: 17.72 });
  kline('on your iPhone.', tx, vh(525, 455), t, 14.08, { size: 84, out: 17.75, color: gradText('#ffffff', C.lilac) });
  [['No account.', 18.0], ['No server.', 18.45], ['No uploads.', 18.9]].forEach(([s, t0], i) => {
    const k = eOut5(seg(t, t0, t0 + 0.22)), a = clamp(k * 2) * (1 - seg(t, 19.4, 19.6)); if (a <= 0) return;
    g.save(); g.translate(tx, vh(400, 330) + i * vh(120, 110)); g.scale(lerp(1.35, 1, k), lerp(1.35, 1, k));
    text(s, 0, 0, { size: 100, weight: 900, ls: -3, a }); g.restore();
  });
  kicker('EVEN THE AI', tx, vh(330, 260), t, 19.6, { out: 21.9 });
  kline('Your AI Coach', tx, vh(430, 360), t, 19.7, { size: 84, out: 21.92 });
  kline('runs on your iPhone.', tx, vh(525, 455), t, 19.82, { size: 84, out: 21.95, color: gradText('#ffffff', C.lilac) });
  rise('Not in a data centre. Not on a server.', tx, vh(600, 530), t, 20.45, { size: 30, color: C.ink2, out: 21.9 });
