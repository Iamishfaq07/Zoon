name: Build

# Compiles Zoon on a GitHub-hosted macOS runner.
#
# This exists because iOS apps can only be built on macOS, and not everyone
# working on this repo has a Mac. Pushing to a branch is enough to get a full
# type-check of both targets — the errors land in the job summary, readable
# without digging through raw logs.
#
# No signing certificates are needed: building for the Simulator with
# CODE_SIGNING_ALLOWED=NO skips provisioning entirely, which is what makes this
# work with nothing configured beyond the repo itself.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight build of the same branch. macOS runner
# minutes are billed at 10x on private repos, so queued-up stale builds are
# expensive in a way Linux ones aren't.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on Linux, so a malformed project file fails in seconds without
  # spending a macOS runner minute (billed at 10x on private repos).
  project:
    name: Validate project file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated project is current
        run: |
          python3 Tools/generate-pbxproj.py
          git diff --exit-code -- Zoon.xcodeproj/project.pbxproj Zoon.xcodeproj/xcshareddata/xcschemes/Zoon.xcscheme
      - name: Parse project.pbxproj
        run: python3 Tools/validate-pbxproj.py Zoon.xcodeproj/project.pbxproj
      - name: Check App Store Connect cert-slot helper
        run: python3 Tools/asc_free_certificate_slot.py --self-test
      - name: Enforce release trust gates
        run: python3 Tools/release-audit.py

  # A job of its own, not a step inside the build.
  #
  # The build job's log runs to well over a hundred thousand characters and
  # the probe's output sits at the very top of it, which makes it unreadable
  # through an API that serves the tail. Here the whole log is the probe.
  sdk-probe:
    name: Probe installed SDK
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe HealthKit workout-zone API
        run: |
          set +e
          {
            for SDKNAME in iphoneos watchos; do
              SDK=$(xcrun --sdk "$SDKNAME" --show-sdk-path 2>/dev/null)
              echo "### HealthKit zone API in ${SDK:-<$SDKNAME sdk not installed>}"
              echo ""
              echo '```'
              HK="$SDK/System/Library/Frameworks/HealthKit.framework"
              if [ -n "$SDK" ] && [ -d "$HK" ]; then
                echo "-- symbols named *Zone* in public headers, .swiftinterface and .apinotes --"
                grep -rhoE "\b(HK[A-Za-z]*Zone[A-Za-z]*)\b" \
                  "$HK/Headers" "$HK/Modules" "$HK/HealthKit.apinotes" 2>/dev/null \
                  | sort -u
                echo "-- declarations mentioning Zone --"
                grep -rhE "Zone" "$HK/Headers" "$HK/Modules" 2>/dev/null \
                  | grep -E "@interface|@property|^- \(|^\+ \(|typedef|func |var |public " \
                  | sort -u | head -40
                echo "-- §21: cycle and menopause identifiers --"
                grep -rhoE "\b(HK[A-Za-z]*(Menopaus|Perimenopaus|Climacteric|Cycle|Menstrual)[A-Za-z]*)\b" \
                  "$HK/Headers" "$HK/Modules" "$HK/HealthKit.apinotes" 2>/dev/null \
                  | sort -u
                echo "-- category identifiers mentioning those concepts --"
                grep -rhiE "menopaus|perimenopaus|climacteric" "$HK/Headers" "$HK/Modules" 2>/dev/null \
                  | sort -u | head -20
                echo "-- for contrast, the same search over the linker stub --"
                for TBD in "$HK/HealthKit.tbd" "$SDK/System/Library/Frameworks/HealthKit.framework/HealthKit.tbd"; do
                  [ -f "$TBD" ] && grep -ohE "_?HK[A-Za-z]*Zone[A-Za-z]*" "$TBD" | sort -u | head -20
                done
              else
                echo "No HealthKit framework at $HK"
              fi
              echo '```'
              echo ""
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

  watch:
    name: Build (watchOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The watch app has only ever been built as something the iOS app
      # embeds. That proves it compiles -- `Verify every source compiled`
      # lists ZoonWatch explicitly for exactly that reason -- and proves
      # nothing about whether it builds *for watchOS*, because an embedded
      # build is driven by the iOS scheme and inherits its destination.
      #
      # It also cannot be run. `xcodebuild` needs a scheme naming the watch
      # target before it can put the app on a watch simulator, so until now
      # the watch could not be launched, screenshotted or regression-tested
      # at all -- the whole ZoonWatch surface has never been photographed.
      # This job is the first half of fixing that: prove the scheme builds
      # standalone for a real watchOS destination before anything tries to
      # install from it.
      - name: Resolve a watch simulator
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > devices.json
          UDID=$(python3 - <<'PYEOF'
          import json
          data = json.load(open("devices.json"))["devices"]
          best = None
          for runtime, devices in sorted(data.items()):
              if "watchOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and "Watch" in d["name"]:
                      best = d
          if best is None:
              raise SystemExit("No watchOS simulator on this runner.")
          print(best["udid"])
          PYEOF
          )
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using watch simulator $UDID"

      - name: Build ZoonWatch for the watch simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Zoon.xcodeproj \
            -scheme ZoonWatch \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee watch-build.log | tail -40

      # Same guarantee the iOS job makes, scoped to the watch: a file dropped
      # from the watch target builds green with the feature missing.
      - name: Verify every watch source compiled
        if: ${{ !cancelled() }}
        run: |
          [ -s watch-build.log ] || { echo "No build log."; exit 0; }
          MISSING=""
          for f in $(find ZoonWatch ZoonWatchWidget -name '*.swift' | sort); do
            base=$(basename "$f")
            grep -q -F -- "/$base" watch-build.log || MISSING="$MISSING $base"
          done
          COUNT=$(find ZoonWatch ZoonWatchWidget -name '*.swift' | wc -l | tr -d ' ')
          {
            echo "### Watch sources"
            echo ""
            if [ -n "$MISSING" ]; then
              echo "Did not reach the compiler:"
              echo ""
              for m in $MISSING; do echo "- \`$m\`"; done
            else
              echo "All $COUNT watch sources compiled."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: watch-build-log
          path: watch-build.log
          if-no-files-found: ignore

  build:
    name: Build (iOS Simulator)
    needs: project
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          echo "### Toolchain" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"
          swift --version 2>&1 | head -2 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Available SDKs:"
          xcodebuild -showsdks | grep -i ios || true

      # §12 asks what workout-zone API the *installed* SDK actually has,
      # rather than what a comment written against an older one believed.
      # Reading the headers is the only way to answer that from here: this
      # repository is developed without a Mac, so the runner's SDK is the
      # only copy of it anybody can look at.
      - name: Build app and widget
        id: build
        run: |
          set -o pipefail
          # generic/platform rather than a named device: simulator model names
          # change between runner images, and a build doesn't need a booted one.
          xcodebuild build \
            -project Zoon.xcodeproj \
            -scheme Zoon \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee build.log

      - name: Run ZoonTests
        id: test
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          # A concrete simulator UDID rather than a device name string: model
          # names available on a runner image drift with the Xcode version,
          # and a hardcoded "iPhone 16" here would eventually start failing
          # for a reason that has nothing to do with whether the tests pass.
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; data=json.load(sys.stdin)['devices']; \
              print(next(d['udid'] for runtime in data.values() for d in runtime if d['name'].startswith('iPhone')))")
          echo "Testing on simulator $UDID"
          xcodebuild test \
            -project Zoon.xcodeproj \
            -scheme Zoon \
            -only-testing:ZoonTests \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee test.log

      - name: Collect crash reports
        # A crashed test process (as opposed to a clean assertion failure)
        # leaves nothing useful in test.log beyond "Restarting after
        # unexpected exit" -- macOS itself writes the actual crash report
        # (signal, faulting thread, stack trace) to DiagnosticReports, but
        # nothing was ever capturing it, so every such crash in this repo's
        # history has gone undiagnosed. Copies whatever's there (empty on an
        # ordinary pass/fail run) so it rides along in the same artifact as
        # test.log instead of being lost when the runner is torn down.
        if: always() && steps.build.outcome == 'success'
        run: |
          mkdir -p crash-reports
          cp ~/Library/Logs/DiagnosticReports/*.ips crash-reports/ 2>/dev/null || true
          cp /Library/Logs/DiagnosticReports/*.ips crash-reports/ 2>/dev/null || true
          echo "Collected $(ls crash-reports | wc -l | tr -d ' ') crash report(s)."
          # Echo the decisive part of the first crash report into the job log
          # as well as the artifact. The artifact is only reachable by someone
          # who can download it; the log is readable through the API, which is
          # the only channel some contributors (and CI tooling) actually have.
          #
          # Parsed rather than `head`-ed: an .ips is a JSON header line plus a
          # JSON body, and the faulting thread's frames sit well past any byte
          # cap that keeps the log readable. Printing the exception, the
          # termination reason, and the symbolicated frames is the whole
          # diagnostic; the rest of the file is register dumps and a binary
          # image list. Only the first report is printed -- when a whole suite
          # dies the reports are all the same crash.
          # Only xctest reports: the runner image ships with unrelated
          # DiagnosticReports (JetsamEvent memory-pressure records and the
          # like) that sort ahead of ours alphabetically and carry no
          # exception/termination at all.
          for f in $(ls crash-reports/xctest-*.ips 2>/dev/null | head -1); do
            echo "=================== $f ==================="
            python3 - "$f" <<'PY' || echo "(could not parse this .ips)"
          import json, sys
          raw = open(sys.argv[1], errors="replace").read()
          body = json.loads(raw[raw.index("\n") + 1:])
          print("exception  :", json.dumps(body.get("exception")))
          print("termination:", json.dumps(body.get("termination")))
          images = body.get("usedImages", [])
          def image_name(i):
              if not isinstance(i, int) or i < 0 or i >= len(images):
                  return "?"
              img = images[i]
              return img.get("name") or img.get("path", "?").rsplit("/", 1)[-1]
          for thread in body.get("threads", []):
              if not thread.get("triggered"):
                  continue
              print("--- faulting thread", thread.get("id"), thread.get("name", ""))
              for frame in thread.get("frames", [])[:30]:
                  sym = frame.get("symbol") or hex(frame.get("imageOffset", 0))
                  print("   ", image_name(frame.get("imageIndex", -1)), sym)
          PY
            echo ""
          done

      - name: Upload test log and crash reports
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: test-log-and-crash-reports
          path: |
            test.log
            crash-reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Summarise tests
        if: always() && steps.build.outcome == 'success'
        run: |
          {
            echo "### ZoonTests"
            echo ""
            if [ "${{ steps.test.outcome }}" = "success" ]; then
              PASSED=$(grep -c "Test Case.*passed" test.log || true)
              echo "${PASSED} test(s) passed."
            else
              echo "Failed. Relevant lines:"
              echo ""
              echo '```'
              grep -E "error:|Test Case.*failed|fatal error" test.log | sort -u || true
              echo '```'
            fi
          # tee, not plain redirection. The step summary is visible only to
          # someone loading the run in a browser; the job log is what the API
          # serves, and that is the only channel remote tooling has. This is
          # the same reasoning the crash-report step above already applies to
          # .ips files -- a failing assertion was the one thing still
          # invisible from outside, which is exactly how this line came to be
          # written.
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run ZoonUITests
        id: uitest
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; data=json.load(sys.stdin)['devices']; \
              print(next(d['udid'] for runtime in data.values() for d in runtime if d['name'].startswith('iPhone')))")
          echo "Testing on simulator $UDID"

          run_uitests() {
            xcodebuild test \
              -project Zoon.xcodeproj \
              -scheme Zoon \
              -only-testing:ZoonUITests \
              -destination "id=$UDID" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              2>&1 | tee "$1"
          }

          # One retry, and only for a launch that never started.
          #
          # `testCoreSleepAndCoachFlowsOpen` failed twice on one commit with
          # "Timed out while launching application via Xcode", and the same
          # code passed on the next commit untouched. Both UI tests launch the
          # app in demo mode and the *first* one passed each time, so the app
          # starts fine; what fails is a second cold launch under the debugger
          # on a busy runner, seventy seconds in.
          #
          # The retry is deliberately narrow. It fires only when the log
          # carries that launch-timeout signature and no assertion failed --
          # a real failure, a crash, or a wrong value is not retried, because
          # a retry that hides those is precisely the silent substitution this
          # workflow exists to catch. And a run that needed the retry says so
          # in the summary rather than passing quietly, so a flake that
          # becomes constant is visible instead of absorbed.
          if ! run_uitests uitest.log; then
            if grep -q "Timed out while launching application" uitest.log \
               && ! grep -q "XCTAssert" uitest.log; then
              echo "::warning::UI tests failed to launch the app; retrying once. This is a runner condition, not a product failure -- if it recurs every run, it has stopped being one."
              echo "retried=1" >> "$GITHUB_OUTPUT"
              mv uitest.log uitest-first-attempt.log
              run_uitests uitest.log
            else
              exit 1
            fi
          fi

      - name: Summarise UI tests
        if: always() && steps.build.outcome == 'success'
        run: |
          {
            echo "### ZoonUITests"
            echo ""
            if [ "${{ steps.uitest.outputs.retried }}" = "1" ]; then
              echo "The first attempt failed to launch the app and was retried."
              echo "See \`uitest-first-attempt.log\` in the artifact."
              echo ""
            fi
            if [ "${{ steps.uitest.outcome }}" = "success" ]; then
              PASSED=$(grep -c "Test Case.*passed" uitest.log || true)
              echo "${PASSED} test(s) passed."
            else
              echo "Failed. Relevant lines:"
              echo ""
              echo '```'
              grep -E "error:|Test Case.*failed|fatal error" uitest.log | sort -u || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report accessibility audit
        # ZoonUITests.testAccessibilityAudit logs every issue Apple's audit
        # finds, prefixed A11Y-AUDIT, and deliberately does not fail on them:
        # the first job is to see what is there. Printed to the job log as
        # well as the summary so it can be read without the artifact.
        if: always() && steps.build.outcome == 'success'
        run: |
          COUNT=$(grep -c "A11Y-AUDIT" uitest.log 2>/dev/null || true)
          echo "Accessibility audit issues: ${COUNT:-0}"
          grep "A11Y-AUDIT" uitest.log 2>/dev/null | sort | uniq -c | sort -rn | head -80 || true
          echo "--- details ---"
          grep "A11Y-DETAIL" uitest.log 2>/dev/null | grep -E "no description|too small|Contrast|clipped" | sort -u | head -120 || true
          {
            echo "### Accessibility audit"
            echo ""
            echo "${COUNT:-0} issue line(s)."
            echo '```'
            grep "A11Y-AUDIT" uitest.log 2>/dev/null | sort | uniq -c | sort -rn | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify every source compiled
        # A file dropped from a target, or excluded by a #if that quietly
        # evaluated false, produces a *successful* build with the feature
        # missing. That's worse than a failure, because nothing reports it.
        # This asserts every .swift on disk actually reached the compiler.
        #
        # ZoonWatch is listed explicitly. Without it the watch target could
        # fail to build at all — or be dropped from the scheme entirely — and
        # this step would still report green, which is precisely the silent
        # failure it exists to catch.
        #
        # The match is anchored on the path separator (`/Name.swift`), not the
        # bare basename: `grep "EvidenceLedger.swift"` also matches
        # `ZoonEvidenceLedger.swift`, `RootView.swift` matches
        # `WatchRootView.swift`, and so on, so a dropped file whose name is a
        # suffix of another file's name used to pass silently.
        #
        # Runs on red builds too (unless the run was cancelled): the list of
        # sources the compiler did or did not reach is useful diagnosis when
        # the build fails part-way. A failed build is already the failure,
        # so in that case this step reports but does not add a second one;
        # and when there is no build.log at all it has nothing to say.
        if: ${{ !cancelled() }}
        run: |
          if [ ! -s build.log ]; then
            echo "No build.log -- the build step did not run, so there is nothing to verify."
            exit 0
          fi
          MISSING=""
          for f in $(find Shared Zoon ZoonWidget ZoonWatch ZoonWatchWidget -name '*.swift' | sort); do
            base=$(basename "$f")
            grep -q -F -- "/$base" build.log || MISSING="$MISSING $base"
          done
          COUNT=$(find Shared Zoon ZoonWidget ZoonWatch ZoonWatchWidget -name '*.swift' | wc -l | tr -d ' ')
          {
            echo "### Sources"
            if [ "${{ steps.build.outcome }}" != "success" ]; then
              echo ""
              echo "Build did not succeed, so this list is expected to be incomplete."
            fi
            if [ -z "$MISSING" ]; then
              echo ""
              echo "All ${COUNT} Swift files reached the compiler."
            else
              echo ""
              echo "**Not seen in the build log** — dropped from a target, or excluded by a \`#if\`:"
              echo ""
              echo '```'
              for m in $MISSING; do echo "$m"; done
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$MISSING" ]; then
            echo "Sources missing from the build: $MISSING"
            # Only fail when the build itself was green; a red build is
            # already red, and an incomplete log is not a second bug.
            if [ "${{ steps.build.outcome }}" = "success" ]; then
              exit 1
            fi
          fi

      - name: Summarise errors
        # Runs even when the build fails — which is the entire point.
        #
        # `tee`, not `>>`. The step summary is readable in a browser but cannot
        # be fetched back through the API, so a failure was only diagnosable by
        # someone with the tab open. The log gets a copy.
        #
        # This is the *last* step that prints anything, and that placement is
        # load-bearing. The API serves job logs from the end, capped, so
        # anything printed earlier falls off the back for a remote reader --
        # which is why the failing-test summary is repeated here rather than
        # left to the step that produced it. Three separate red runs were
        # diagnosed as "tests failed, contents unknown" before this was added,
        # and the artifact that holds `test.log` is not always reachable
        # either: an egress policy can refuse the blob-storage host the
        # download URL points at.
        if: always()
        run: |
          {
            for log in test.log uitest.log; do
              [ -s "$log" ] || continue
              FAILURES=$(grep -E "error:|Test Case.*failed|fatal error" "$log" | sort -u || true)
              [ -n "$FAILURES" ] || continue
              echo "### Failing tests in ${log}"
              echo ""
              echo '```'
              printf '%s\n' "$FAILURES" | head -40
              echo '```'
              echo ""
            done
            echo "### Result"
            if [ "${{ steps.build.outcome }}" = "success" ]; then
              echo ""
              echo "Build succeeded."
            else
              echo ""
              ERRORS=$(grep -E "error:" build.log | sort -u || true)
              COUNT=$(printf '%s' "$ERRORS" | grep -c . || true)
              echo "Build failed with ${COUNT} unique error line(s)."
              echo ""
              echo '```'
              # Capped: a single missing type can cascade into hundreds of
              # follow-on errors, and the first few are the ones that matter.
              printf '%s\n' "$ERRORS" | head -60
              echo '```'
              echo ""
              echo "<details><summary>Warnings</summary>"
              echo ""
              echo '```'
              grep -E "warning:" build.log | sort -u | head -40 || true
              echo '```'
              echo "</details>"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          # The UI-test logs ride along here rather than with `test.log`,
          # which is uploaded before the UI tests have run. The first-attempt
          # log only exists when a launch timed out and was retried, and it is
          # the thing to read when deciding whether that retry is still
          # covering a runner condition or has started covering a defect.
          path: |
            build.log
            uitest.log
            uitest-first-attempt.log
          retention-days: 14
          if-no-files-found: warn
