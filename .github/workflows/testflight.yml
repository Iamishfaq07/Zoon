name: TestFlight

# Archives, signs, and uploads Zoon to TestFlight — from the same free
# macOS runner Build and Screenshots already use. No Mac, no local Xcode,
# no manually-exported certificates.
#
# Requires an Apple Developer Program membership ($99/yr) and four repo
# secrets — see BUILDING-WITHOUT-A-MAC.md → "Option A: TestFlight from CI"
# for the one-time setup. Until those secrets exist this workflow will fail
# immediately and cleanly at the "Check required secrets" step, rather than
# midway through a 15-minute archive.
#
# Signing is automatic (`-allowProvisioningUpdates`), authenticated with an
# App Store Connect API key rather than an Apple ID + password. The key can
# create and download whatever certificates and profiles it needs on the
# runner, so nothing is manually exported, base64-encoded, or kept in sync
# by hand — the classic way this kind of workflow rots.
#
# One thing that mechanism cannot do anything about: a signing *certificate*
# has a private key, and that key is generated locally at creation time and
# never leaves the machine that made it -- Apple only ever sees and stores
# the public half. Every run here starts on a brand-new, disposable runner
# with an empty keychain, so with nothing else in place it has no choice but
# to mint a fresh certificate every single time, and the previous run's
# certificate is orphaned forever the moment its runner is destroyed
# (Apple still lists it as valid; nothing can ever use it again). Do that
# enough times and the account hits Apple's cap on live certificates, and
# every run fails at Archive with "Choose a certificate to revoke" --
# which is what happened here on 2026-09-08.
#
# The fifth, optional secret below breaks that cycle: after the first run
# that creates a certificate, this workflow exports it and lets
# actions/cache persist it, so every later run imports the *same* identity
# instead of minting a new one. Omit IOS_P12_PASSWORD and the workflow
# behaves exactly as before -- one new certificate per run -- which still
# works, right up until the account fills up again.
#
# When the account *has* filled up (Archive fails with "Choose a certificate
# to revoke"), dispatch the workflow with the `free_certificate_slot` input
# ticked. The "Free a signing-certificate slot" step then revokes the oldest
# distribution certificate(s) needed to free exactly one slot; on every other
# run that step is a dry run that only reports the team's certificate state.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'CFBundleVersion override (defaults to the GitHub run number)'
        required: false
        type: string
      free_certificate_slot:
        description: >-
          Revoke the OLDEST distribution certificate(s) on the team so that one
          slot is free for this run to mint into. Only needed after Archive
          has failed with "Choose a certificate to revoke". Off by default:
          the slot step then only reports what it would do.
        required: false
        type: boolean
        default: false

concurrency:
  group: testflight-${{ github.ref }}
  # A TestFlight upload should never be cancelled mid-flight by a newer
  # push — that risks an inconsistent build reaching App Store Connect.
  cancel-in-progress: false

jobs:
  release:
    name: Archive and upload
    runs-on: macos-latest
    timeout-minutes: 45

    # Job-level so the caching steps' `if:` conditions below can read
    # env.IOS_P12_PASSWORD directly, and so the steps that need the value
    # itself don't each have to redeclare it.
    env:
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        # Fails in seconds with a clear message, instead of failing 20
        # minutes into an archive with a cryptic signing error. Every secret
        # is named so a missing one is obvious from the log alone.
        #
        # IOS_P12_PASSWORD is deliberately not checked here -- it's optional
        # (see the file header), and its absence should never block a run
        # that would otherwise work.
        run: |
          missing=""
          [ -z "${{ secrets.APPSTORE_ISSUER_ID }}" ] && missing="$missing APPSTORE_ISSUER_ID"
          [ -z "${{ secrets.APPSTORE_KEY_ID }}" ] && missing="$missing APPSTORE_KEY_ID"
          [ -z "${{ secrets.APPSTORE_PRIVATE_KEY }}" ] && missing="$missing APPSTORE_PRIVATE_KEY"
          [ -z "${{ secrets.APPLE_TEAM_ID }}" ] && missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secret(s):$missing"
            echo "See BUILDING-WITHOUT-A-MAC.md → 'TestFlight from CI' for how to create each one."
            exit 1
          fi
          if [ -z "${{ secrets.IOS_P12_PASSWORD }}" ]; then
            echo "::notice::IOS_P12_PASSWORD is not set -- this run will mint a fresh signing certificate rather than reusing a cached one. See BUILDING-WITHOUT-A-MAC.md → 'TestFlight from CI' if you want to stop that from eventually filling up your account's certificate limit."
          fi

      - name: Install the App Store Connect API key
        # xcodebuild looks for the key in this exact location. The key
        # content itself never touches disk in the log or in a temp file
        # outside this directory.
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APPSTORE_PRIVATE_KEY }}" > \
            ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8

      - name: Set the build number
        id: version
        run: |
          NUMBER="${{ inputs.build_number }}"
          if [ -z "$NUMBER" ]; then NUMBER="${{ github.run_number }}"; fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "Build number: $NUMBER"

      - name: Verify generated project is current
        run: |
          python3 Tools/generate-pbxproj.py
          git diff --exit-code -- Zoon.xcodeproj/project.pbxproj Zoon.xcodeproj/xcshareddata/xcschemes/Zoon.xcscheme
          python3 Tools/validate-pbxproj.py Zoon.xcodeproj/project.pbxproj
          python3 Tools/asc_free_certificate_slot.py --self-test

      - name: Run release-gate tests
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; data=json.load(sys.stdin)['devices']; \
              print(next(d['udid'] for runtime in data.values() for d in runtime if d['name'].startswith('iPhone')))")
          xcodebuild test \
            -project Zoon.xcodeproj \
            -scheme Zoon \
            -configuration Release \
            -only-testing:ZoonTests \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee test.log

      - name: Restore the cached signing identity
        # Skipped entirely (silently -- actions/cache no-ops with an empty
        # key) when IOS_P12_PASSWORD isn't set, so a repo that hasn't opted
        # into caching sees no change in behaviour. The key is a fixed
        # string, not hashed from anything: there is exactly one identity to
        # remember, and it changes only when this key is bumped on purpose
        # (see the comment on the save step below) or the cache is cleared
        # from the repo's Actions settings.
        id: signing-cache
        if: env.IOS_P12_PASSWORD != ''
        uses: actions/cache@v4
        with:
          path: build/signing/identity.p12
          key: ios-signing-identity-v1

      - name: Import the cached signing identity
        # Only on a cache hit -- on a miss there is nothing to import yet,
        # and Archive below falls back to -allowProvisioningUpdates minting
        # a fresh one, exactly as it always has.
        #
        # A dedicated keychain rather than the runner's default login
        # keychain: security import writes into whichever keychain is
        # named, and creating this run's identity in one we control (added
        # to the search list, never assumed) is more predictable than
        # guessing what state the default keychain starts a runner in.
        #
        # A random keychain password, not a blank one -- generated fresh
        # here, used only to unlock this keychain for the rest of this same
        # job, and never written anywhere it would need to be remembered.
        # An empty password is a common shortcut in scripts like this one
        # and probably would have worked, but nothing here depends on it
        # working, so there's no reason to depend on a macOS security-policy
        # detail that could differ across runner images or Xcode versions.
        if: steps.signing-cache.outputs.cache-hit == 'true'
        run: |
          set -o pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import build/signing/identity.p12 -k "$KEYCHAIN" -P "$IOS_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          existing=$(security list-keychains -d user | sed 's/"//g')
          security list-keychains -d user -s "$KEYCHAIN" $existing
          echo "Imported the cached signing identity into $KEYCHAIN"

      - name: Prepare a keychain for a newly minted identity
        # The other half of the caching story, and the reason caching has
        # never actually worked once.
        #
        # On a cache *hit* the step above creates a keychain whose password
        # this job generated, so the identity in it is exportable. On a
        # *miss* -- which is every run so far -- Archive minted the identity
        # into the runner's login keychain instead, whose password is not
        # ours to know. `security export` then blocked on a GUI
        # authorization prompt that cannot be answered on a headless runner,
        # which is what hung run 63 on 2026-09-09.
        #
        # Creating a keychain we control and making it the default gives a
        # newly minted identity somewhere exportable to land. Whether Xcode
        # honours the default keychain for this is not something this
        # workflow should bet on, so the export step after the upload tries
        # the login keychain as well -- if the identity lands there anyway,
        # nothing is lost.
        if: env.IOS_P12_PASSWORD != '' && steps.signing-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          existing=$(security list-keychains -d user | sed 's/"//g')
          security list-keychains -d user -s "$KEYCHAIN" $existing
          security default-keychain -s "$KEYCHAIN"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "Created $KEYCHAIN and made it the default for this job."

      - name: Free a signing-certificate slot
        # On a cache miss we are about to mint, and a newly minted certificate
        # needs a free slot on the team. Runs 66 and 67 died at Archive with
        # "Choose a certificate to revoke" because orphaned certificates from
        # earlier runners (private keys long gone) still counted against
        # Apple's cap.
        #
        # This step is a DRY RUN by default: it lists the team's distribution
        # certificates and says which one it *would* revoke, and nothing else.
        # It only deletes anything when the workflow was dispatched with the
        # `free_certificate_slot` input ticked, and even then the script
        # revokes only the oldest distribution certificate(s) needed to free
        # exactly one slot -- never development certificates (those belong to
        # people's Macs), never the whole type. See Tools/asc_free_certificate_slot.py.
        #
        # Condition: run whenever this job is going to mint, i.e. whenever the
        # restore step did NOT produce a cache hit. `signing-cache` is skipped
        # entirely when IOS_P12_PASSWORD is unset (see its `if:`); a skipped
        # step has outcome 'skipped' and an empty `cache-hit`, and in that
        # configuration every run mints, so the step must run then too. The
        # `outcome != 'success'` half makes that explicit rather than relying
        # on an empty string comparing unequal to 'true'; the `cache-hit`
        # half covers a successful restore that simply found nothing. On a
        # genuine hit the cached identity is the one we would otherwise be
        # deleting, so the step is skipped. Because the default is a dry run,
        # running it "too often" costs one API call and a few log lines, not
        # a certificate.
        if: steps.signing-cache.outcome != 'success' || steps.signing-cache.outputs.cache-hit != 'true'
        run: |
          REVOKE=""
          if [ "${{ inputs.free_certificate_slot }}" = "true" ]; then
            REVOKE="--revoke"
            echo "::warning::free_certificate_slot was requested -- the oldest distribution certificate(s) needed to free one slot WILL be revoked."
          else
            echo "Dry run: listing certificates only. Re-run with the free_certificate_slot input ticked to actually free a slot."
          fi
          # Both families, because this workflow fills the *development* one.
          # Every run that cannot reuse a cached identity mints an Apple
          # Development certificate on a runner that is then destroyed, so
          # the account accumulates development certificates whose private
          # keys no longer exist anywhere -- ten of them by run 89, against
          # zero distribution certificates. Listing distribution only meant
          # the step reported a free slot and stood down while the family
          # that was actually full went unexamined.
          #
          # Still a dry run unless free_certificate_slot is ticked, and still
          # only ever the oldest certificates needed to free one slot.
          python3 Tools/asc_free_certificate_slot.py $REVOKE \
            --type distribution \
            --type development \
            --max-per-type 2 \
            --key-id "${{ secrets.APPSTORE_KEY_ID }}" \
            --issuer-id "${{ secrets.APPSTORE_ISSUER_ID }}" \
            --key-path "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8"

      - name: Archive
        # Signing here is deliberately left to automatic signing, which
        # archives with an *Apple Development* identity and lets
        # `-exportArchive` re-sign with distribution afterwards. That is the
        # normal flow and it is how builds 60 and 65 reached TestFlight.
        #
        # Run 90 tried pinning CODE_SIGN_IDENTITY="Apple Distribution" to
        # dodge a full development-certificate family, and Xcode rejected it
        # outright: "Zoon is automatically signed for development, but a
        # conflicting code signing identity Apple Distribution has been
        # manually specified." The certificate family this archive needs is
        # not negotiable from here -- it needs a free Development slot.
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Zoon.xcodeproj \
            -scheme Zoon \
            -configuration Release \
            -archivePath build/Zoon.xcarchive \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.APPSTORE_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.number }}" \
            CODE_SIGN_STYLE=Automatic \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee archive.log

      - name: Write the export options
        # method=app-store-connect (not the older "app-store") is what
        # current Xcode expects for a TestFlight/App Store destination.
        # destination=upload skips the local .ipa entirely and sends the
        # archive straight to App Store Connect during export — one fewer
        # step, and one fewer place for a stale IPA to go stale.
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          PLIST

      - name: Export and upload to TestFlight
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Zoon.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.APPSTORE_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}" \
            2>&1 | tee export.log

      - name: Cache the signing identity for future runs
        # Runs AFTER the upload, deliberately. This is an optimisation for
        # *future* runs -- it must never stand between a successful archive
        # and the build reaching a phone. It sat before the export once, and
        # on the first run that actually executed it (2026-09-09, the first
        # run after IOS_P12_PASSWORD was set) it hung the job with a finished
        # archive that was never uploaded.
        #
        # Why it hung: the identity -allowProvisioningUpdates had just minted
        # carries an ACL that does not permit non-interactive export, so
        # `security export` blocked on a GUI authorization prompt that cannot
        # appear on a headless runner. set-key-partition-list below grants
        # /usr/bin/security access up front; `timeout` and `|| true` make
        # certain that a prompt, a locked keychain or any other surprise
        # costs this run nothing. Failing to cache is survivable -- it just
        # means the next run mints a fresh certificate, which is exactly what
        # every run did before caching existed. Hanging is not.
        #
        # Only on a cache miss (the identity we just used was newly minted by
        # Archive, not imported) and only once the upload has succeeded --
        # there is no point persisting a certificate tied to a broken
        # configuration.
        #
        # Exports every identity in the runner's default login keychain.
        # Safe specifically because this is a fresh, single-tenant runner:
        # the only certificate that can be in there is the one
        # -allowProvisioningUpdates created a few minutes ago while signing
        # this same archive.
        #
        # actions/cache writes under `key` only on a miss and a key can
        # never be overwritten -- if a cached identity is ever revoked (as
        # happened on 2026-09-08, clearing space for a fresh one to be made
        # by hand) the next run will still try to import the now-invalid
        # cached copy and fail. Recovery is bumping the key here and on the
        # restore step above (v1 -> v2), or clearing the cache from the
        # repo's Actions settings -- either forces a fresh certificate to be
        # minted and cached in its place.
        if: env.IOS_P12_PASSWORD != '' && steps.signing-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          # No -e: a failed export on the first keychain must fall through to
          # the second, not abandon the step.
          set +e
          mkdir -p build/signing
          exported=""

          for keychain in "$SIGNING_KEYCHAIN" login.keychain-db; do
            [ -n "$keychain" ] || continue
            if [ "$keychain" = "login.keychain-db" ]; then
              # The login keychain on a hosted runner is already unlocked and
              # its password is not ours to know, so an empty one is the only
              # thing worth trying and its failure is not interesting.
              keychain_password=""
            else
              keychain_password="$SIGNING_KEYCHAIN_PASSWORD"
            fi

            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$keychain_password" "$keychain" >/dev/null 2>&1

            # A plain shell watchdog rather than `timeout`: macOS ships no
            # timeout(1), only gtimeout(1) if coreutils happens to be
            # present, and this must not depend on that. Redirecting stdin is
            # not enough on its own -- the prompt that hung run 63 is a GUI
            # authorization dialog, not a read from the terminal -- so
            # killing the process is the only reliable escape.
            security export -k "$keychain" -t identities -f pkcs12 \
              -P "$IOS_P12_PASSWORD" -o build/signing/identity.p12 </dev/null &
            export_pid=$!
            ( sleep 60; kill -9 "$export_pid" 2>/dev/null ) &
            watchdog_pid=$!
            wait "$export_pid"
            rc=$?
            kill "$watchdog_pid" 2>/dev/null

            if [ "$rc" -eq 0 ] && [ -s build/signing/identity.p12 ]; then
              exported="$keychain"
              break
            fi
            rm -f build/signing/identity.p12
          done

          if [ -n "$exported" ]; then
            echo "Exported this run's signing identity from $exported for actions/cache to persist."
          else
            echo "Could not export the signing identity from any keychain, so nothing"
            echo "is cached and the next run will mint a fresh certificate, exactly as"
            echo "every run did before caching existed. The build itself is already"
            echo "uploaded and is unaffected by this."
          fi
          exit 0

      - name: Summarise
        if: always()
        run: |
          {
            echo "### TestFlight"
            echo ""
            if grep -q "Upload succeeded" export.log 2>/dev/null; then
              echo "Uploaded build **${{ steps.version.outputs.number }}**. It will appear in"
              echo "App Store Connect → TestFlight in a few minutes, once Apple finishes"
              echo "processing it — that step happens on Apple's servers, not here."
            else
              echo "Upload did not confirm success. Check the logs below."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        # Always, and always all three: whichever step failed, the log that
        # explains why is the one worth having, and a missing archive.log
        # from a failed archive step is a dead end on its own.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            test.log
            archive.log
            export.log
            build/export
          retention-days: 14
          if-no-files-found: ignore
