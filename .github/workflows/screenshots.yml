name: Screenshots

# Boots an iOS Simulator on a GitHub-hosted macOS runner, installs Zoon, and
# photographs every screen. Download the artifact to see the real app rendered
# by real SwiftUI at real sizes — no Mac, no Apple ID, no certificates, no
# money.
#
# This is also the only automated evidence that the app *launches*. The Build
# workflow proves it compiles; a compiling app can still crash in
# `ModelContainer(for:)` on first run. Here the process has to survive long
# enough to draw a frame, and the run fails if it doesn't.
#
# Deliberately not on every push: booting a simulator is slow, and macOS
# minutes bill at 10x on private repos.
#
# This run exists to answer a question two rounds of code changes could not.
# A device reported text overlapping "everywhere" at a raised text size, and
# large-text capture only ever covered three screens -- so every fix since has
# been reasoned about rather than looked at. The accessibility block below now
# photographs the nine screens the layout work actually touches, at AX5 and
# again at AX1, and Tomorrow joins the default-size set so there is a baseline
# to compare each of them against.
# Two ways to run it:
#
#   - **Actions tab → Screenshots → Run workflow.** Note that GitHub only
#     offers that button for workflows present on the *default* branch, so
#     until this is merged the dispatch trigger won't appear.
#   - **Touch this file and push.** The `paths` filter below makes editing the
#     workflow (or the launch-argument plumbing it drives) the request to run
#     it, which is what makes it usable from a feature branch.

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Simulator device name'
        default: 'iPhone 17 Pro'
        type: string
        required: false
  push:
    paths:
      - '.github/workflows/screenshots.yml'
      - 'Zoon/Services/LaunchOptions.swift'

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

# Needed to commit the downscaled captures back to the branch.
permissions:
  contents: write

jobs:
  capture:
    name: Capture screenshots
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      BUNDLE_ID: com.zoon.sleep
      # `inputs` is empty on a push trigger, so the default lives here rather
      # than only in the dispatch form.
      DEVICE: ${{ inputs.device || 'iPhone 17 Pro' }}

    steps:
      - uses: actions/checkout@v4

      - name: Boot simulator
        id: sim
        run: |
          set -euo pipefail
          # Resolve the device by name to a UDID. Runner images add and remove
          # device models between releases, so a hard-coded UDID — or a name
          # passed straight to xcodebuild — breaks silently later.
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "
          import json,sys
          want = '''${DEVICE}'''
          data = json.load(sys.stdin)['devices']
          for runtime, devices in sorted(data.items()):
              for d in devices:
                  if d['name'] == want:
                      print(d['udid']); sys.exit(0)
          # Nothing matched: fall back to the newest iPhone the image has, and
          # say so, rather than failing over a renamed device model.
          best = None
          for runtime, devices in sorted(data.items()):
              for d in devices:
                  if d['name'].startswith('iPhone'):
                      best = d
          if best is None:
              sys.exit('No iPhone simulator available on this runner.')
          print(best['udid'], file=sys.stdout)
          print('Falling back to ' + best['name'], file=sys.stderr)
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          # Freeze the status bar so screenshots are reproducible: without this
          # the clock and battery differ on every run and every image shows as
          # changed in a diff.
          xcrun simctl status_bar "$UDID" override \
            --time "9:41" --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 --wifiMode active --wifiBars 3

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Zoon.xcodeproj \
            -scheme Zoon \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Inspect the built bundle
        # Everything here is invisible to the compiler. `GENERATE_INFOPLIST_FILE`
        # synthesises both Info.plists from build settings, and a wrong or
        # missing key produces a perfectly good binary that iOS then refuses to
        # install. Dumping them is the only way to see what was actually written.
        run: |
          set -euo pipefail
          APP=$(find DerivedData/Build/Products -maxdepth 3 -name 'Zoon.app' | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          # `tee`, not `>>`: the step summary is convenient to read in the
          # browser but can't be fetched back through the API, so the log gets
          # a copy too.
          {
            echo "### Bundle"
            echo ""
            echo '<details><summary>Zoon.app/Info.plist</summary>'
            echo ""; echo '```'
            plutil -p "$APP/Info.plist"
            echo '```'; echo "</details>"
            for ext in "$APP"/PlugIns/*.appex; do
              [ -e "$ext" ] || continue
              echo ""
              echo "<details><summary>$(basename "$ext")/Info.plist</summary>"
              echo ""; echo '```'
              plutil -p "$ext/Info.plist"
              echo '```'; echo "</details>"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install and capture
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          if [ -z "${APP:-}" ]; then echo "No Zoon.app in build products"; exit 1; fi

          # A bad app *extension* must not cost us the app's screenshots — the
          # widget isn't visible in any of them. Try the whole bundle first, and
          # on failure install a copy with PlugIns stripped, loudly.
          EXT_BROKEN=0
          echo "Installing $APP"
          if ! xcrun simctl install "$UDID" "$APP"; then
            EXT_BROKEN=1
            echo "::warning::Installing the full bundle failed. Retrying without the widget extension — the widget will not be present in this build."
            rm -rf /tmp/stripped && mkdir -p /tmp/stripped
            cp -R "$APP" /tmp/stripped/
            rm -rf /tmp/stripped/Zoon.app/PlugIns
            xcrun simctl install "$UDID" /tmp/stripped/Zoon.app
          fi
          echo "EXT_BROKEN=$EXT_BROKEN" >> "$GITHUB_ENV"

          mkdir -p screenshots

          # Crash reports land on the *host*, not inside the simulator. Clearing
          # them first means anything found afterwards belongs to this run.
          CRASH_DIR="$HOME/Library/Logs/DiagnosticReports"
          mkdir -p "$CRASH_DIR"
          rm -f "$CRASH_DIR"/Zoon*.ips || true

          # shoot <tab> [variant]
          #
          # `variant` only ever affects the output filename and, for `light`,
          # the appearance override. `largeText` deliberately passes no
          # arguments: the caller sets the simulator's content size around the
          # call, because Dynamic Type is a system setting and faking it from
          # inside the app would exercise the wrong code path.
          shoot() {
            local tab="$1"
            local variant="${2:-dark}"
            local output="$tab"
            local appearance_args=()
            case "$variant" in
              light)
                output="${tab}-light"
                appearance_args=(-zoon.pref.appearance light)
                ;;
              day|morning|night)
                # Today draws a different hero per time-of-day band, so
                # without pinning it capture renders whichever band the
                # runner happened to be in. The recovery ring only exists in
                # `day`, which is why it had never been photographed.
                output="today-${variant}"
                appearance_args=(-zoonMoment "$variant")
                ;;
              dayLight)
                output="today-day-light"
                appearance_args=(-zoonMoment day -zoon.pref.appearance light)
                ;;
              accessibilityMedium)
                output="${tab}-accessibilityMedium"
                ;;
              dayAccessibilityMedium)
                # Same reasoning as `dayLargeText`: the hero under test only
                # exists in the `day` band.
                output="today-accessibilityMedium"
                appearance_args=(-zoonMoment day)
                ;;
              dayLargeText)
                # The hero being checked at large type -- ring, radar, score
                # drivers, plan -- only exists in the `day` band, so an
                # unpinned large-text shot of Today photographs whichever
                # band the runner happened to be in and proves nothing
                # about the layout it was raised to test.
                output="today-largeText"
                appearance_args=(-zoonMoment day)
                ;;
              splash)
                # -zoonSplash YES both enables the launch splash under
                # -zoonDemo and holds it on screen, since the capture below
                # doesn't shoot for six seconds and the splash hands over
                # after one. See LaunchOptions.holdsSplash.
                output="splash"
                appearance_args=(-zoonSplash YES)
                ;;
              dark) ;;
              *) output="${tab}-${variant}" ;;
            esac
            # --terminate-running-process so each tab gets a clean launch;
            # the tab is chosen at launch (see LaunchOptions) rather than by
            # driving the tab bar, which would need a UI-test target.
            #
            # `${appearance_args[@]+"${appearance_args[@]}"}`, not a plain
            # `"${appearance_args[@]}"`: /bin/bash on macOS is 3.2 (Apple
            # freezes it there for licensing reasons), and bash 3.2 treats
            # expanding an *empty* array under `set -u` as an unbound
            # variable -- a real bug, fixed upstream in bash 4.4, that fired
            # on every dark-appearance shot (the common case, since
            # appearance_args only gets populated for light) and aborted the
            # whole capture before a single screenshot was taken.
            xcrun simctl launch --terminate-running-process "$UDID" \
              "$BUNDLE_ID" -zoonDemo YES -zoonTab "$tab" \
              ${appearance_args[@]+"${appearance_args[@]}"} > /dev/null

            # SwiftUI needs a moment to lay out and run its entry animations.
            # Polling for "the view is ready" isn't possible from outside the
            # process without instrumenting the app, so this is a plain wait.
            sleep 6

            # Shoot *before* checking liveness. A crash that happens after the
            # first frame still leaves a usable screenshot, and having the
            # picture of the screen that died is worth more than the ordering
            # purity of failing first.
            xcrun simctl io "$UDID" screenshot "screenshots/${output}.png" || true

            # simctl launch returns 0 whether or not the process survives, so
            # the absence of the process is the real signal.
            #
            # Collected into a variable rather than piped straight into grep.
            # `... launchctl list | grep -q` is wrong under `pipefail`: grep -q
            # exits on the first match, SIGPIPEs launchctl, and the pipeline
            # reports failure *because the app was found*. That produced two
            # phantom crash reports before the broken-pipe message gave it away.
            local processes
            processes=$(xcrun simctl spawn "$UDID" launchctl list || true)
            # A here-string, not `printf ... | grep -q`. The comment above
            # describes this trap for `launchctl list | grep -q`; the same
            # trap was still live one line down. `grep -q` exits on the first
            # match, which SIGPIPEs the `printf` feeding it -- so under
            # `pipefail` the pipeline reports failure *because the app was
            # found*, and the check announces the app died when it is
            # running. It fired on `trends-largeText` in run 61, half a
            # second after that screen's screenshot was written successfully.
            # A here-string is not a pipeline, so there is nothing to break.
            if ! grep -q "$BUNDLE_ID" <<< "$processes"; then
              echo "::error::Zoon died on screen '$output'."

              # The .ips crash report carries the exception type and the stack.
              # `log show` was tried first and is the wrong tool: it's dominated
              # by UIKit lifecycle chatter, so a tail of it shows the launch and
              # cuts off before the crash.
              for report in "$CRASH_DIR"/Zoon*.ips; do
                [ -e "$report" ] || continue
                echo "--- $(basename "$report") ---"
                cat "$report"
              done

              echo "--- errors and faults only ---"
              xcrun simctl spawn "$UDID" log show --last 3m \
                --predicate 'process == "Zoon" AND messageType >= 16' \
                --style compact | tail -40 || true
              return 1
            fi

            echo "Captured $output"
          }

          # Ordered as a walkthrough: first run, then the tabs, then the
          # screens that need a tap to reach. Keep sleepDetail in the list —
          # it is where the hypnogram lives, and a missing hypnogram is only
          # visible in a render. Same for report: a nested NavigationStack
          # there silently swallowed the push, and the capture is what showed
          # the More screen where the report should have been. And the
          # hypnogram's axis labels, which wrapped once the type started
          # scaling — fixed-width columns holding no-longer-fixed-size text.
          # "coach" was missing here -- the tab bar moved to Today/Sleep/
          # Insights/Coach a while back (RootView.Tab), but this list still
          # only shot the first three real tabs plus the journal/more
          # sheets. Added alongside trends/coach so the walkthrough covers
          # every tab, not three of the current four.
          # evidence/patterns/sensorTruth were reachable via DeepLink for a
          # while but never captured, which meant the three screens carrying
          # the V8 redesign's most structural visuals -- the evidence ledger's
          # dated spine, the constellation graph, and the coverage matrix --
          # were the least verified in the app. A graph layout is exactly the
          # kind of thing that compiles, passes tests, and still overlaps its
          # own labels; only a render shows it.
          FAILED=0
          for tab in onboarding today sleep trends coach journal more \
                     sleepDetail nightHistory bodyClock soundscapes nap breathing snoreCheck \
                     report settings badges evidence patterns sensorTruth tomorrow; do
            shoot "$tab" || FAILED=1
          done
          # The app is dark-first, but Light is a real preference. Keep
          # representative screens in the visual regression set so neutral
          # strokes and secondary text cannot silently disappear on pale
          # cards. Journal added alongside today/settings because it's the
          # heaviest user of Theme.neutral() (segmented pill, selection
          # capsule, dividers) of any screen -- a Light regression there
          # went unverified by screenshot until now.
          # The launch splash: the one screen every user sees on every cold
          # start, and until now the only one no capture had ever rendered.
          shoot today splash || FAILED=1

          shoot today light || FAILED=1
          shoot settings light || FAILED=1
          shoot journal light || FAILED=1
          # The other three tabs in Light. Only today/settings/journal were
          # ever captured in Light, so Sleep, Insights and Coach -- three of
          # the four tabs -- had no light-appearance render at all, and a
          # washed-out or invisible label there could not be seen from here.
          # The past-night moons in Light. They live too far down the Sleep
          # tab for a capture to reach, so this screen -- which leads with
          # the same strip -- is the only render of them there is.
          # Today's other three heroes, pinned so they render every run
          # rather than whenever the clock happens to agree.
          shoot today day || FAILED=1
          shoot today dayLight || FAILED=1
          shoot today morning || FAILED=1
          shoot today night || FAILED=1

          shoot nightHistory light || FAILED=1

          shoot sleep light || FAILED=1
          shoot trends light || FAILED=1
          shoot coach light || FAILED=1

          # Largest Dynamic Type, on the three screens with the most competing
          # text. V8 removed the app-wide `.accessibility5` cap
          # (`Theme.zoonTypography`), which means the size someone can actually
          # select is now larger than any size this capture had ever rendered.
          # The checked-in previews cover it in Xcode, but nobody in CI opens
          # Xcode -- and the failure mode here is silent truncation, not a
          # crash, so a passing build proves nothing about it.
          #
          # Set on the *simulator*, not via a launch argument: Dynamic Type is
          # a system setting, and overriding `dynamicTypeSize` from inside the
          # app would test SwiftUI's modifier rather than the real path a
          # user's setting takes.
          echo "Raising Dynamic Type to the largest accessibility size"
          xcrun simctl ui "$UDID" content_size accessibility-extra-extra-extra-large || \
            echo "::warning::Could not set content size; large-text shots will match the default."
          shoot today dayLargeText || FAILED=1
          # The rest of the screens a large-text report has to cover. Three of
          # them had never been photographed above the default size at all,
          # and the failure mode is silent overlap rather than a crash -- so a
          # green build and a passing test suite said nothing about any of
          # this. A device did, twice, which is how these came to be added.
          #
          # Patterns and Evidence are here because they are the two screens
          # built out of laid-out graphics rather than stacked text: a
          # constellation's node labels and a ledger's dated spine both place
          # text at computed positions, which is exactly what stops fitting
          # first. Coach and Tomorrow carry the longest sentences in the app.
          # Journal is the densest grid of pills, and a pill is where text
          # collapses to one character per line.
          for tab in sleepDetail trends patterns evidence coach journal settings tomorrow; do
            shoot "$tab" largeText || FAILED=1
          done
          # One step below the ceiling as well. AX5 is the extreme and the
          # easy thing to design for; AX1 is the size people actually use,
          # and a layout that reflows correctly at the extreme can still be
          # wrong in the band before it reaches the reflow.
          echo "Dropping to the first accessibility size"
          xcrun simctl ui "$UDID" content_size accessibility-medium || true
          shoot today dayAccessibilityMedium || FAILED=1
          shoot trends accessibilityMedium || FAILED=1
          xcrun simctl ui "$UDID" content_size medium || true

          # --- Launch once WITHOUT demo mode -------------------------------
          #
          # Every capture above passes -zoonDemo YES, which forces the mock
          # dataset and skips HealthKit outright. That is correct for
          # screenshots -- the Simulator has a Health store but no sleep in it
          # and nobody to tap the permission sheet -- but it means the real
          # HealthKit path has never been launched by CI at any point, and a
          # crash reported on a device (build 65, 2026-09-09) did not
          # reproduce in any captured screen.
          #
          # So: one plain launch, no arguments, purely to see whether the
          # process survives. It is expected to stop on the authorization
          # sheet, and a live process sitting on that sheet is a pass -- the
          # only thing being asked here is "does it still exist".
          #
          # Never fails the job. A screenshot run that goes red because a
          # diagnostic probe is inconclusive would cost more than it explains;
          # the crash report it prints is the entire deliverable.
          echo "Launching once without -zoonDemo to exercise the real HealthKit path"
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
          xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE_ID" \
            >/dev/null 2>&1 || true
          sleep 8
          xcrun simctl io "$UDID" screenshot "screenshots/liveHealthKit.png" || true
          live=$(xcrun simctl spawn "$UDID" launchctl list || true)
          # Here-string for the same reason as the liveness check above.
          if grep -q "$BUNDLE_ID" <<< "$live"; then
            echo "Survived a non-demo launch (most likely sitting on the Health sheet)."
          else
            echo "::warning::Zoon died on a non-demo launch -- this is the device crash reproducing."
            for report in "$CRASH_DIR"/Zoon*.ips; do
              [ -e "$report" ] || continue
              echo "--- $(basename "$report") ---"
              cat "$report"
            done
          fi

          exit $FAILED

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Screenshots"
            echo ""
            if [ "${EXT_BROKEN:-0}" = "1" ]; then
              echo "> The widget extension could not be installed, so it was"
              echo "> stripped before installing. The screenshots below are the"
              echo "> app only. See the extension's Info.plist above."
              echo ""
            fi
            if [ -d screenshots ] && [ -n "$(ls -A screenshots 2>/dev/null)" ]; then
              echo "Captured on \`$DEVICE\`:"
              echo ""
              for f in screenshots/*.png; do
                echo "- \`$(basename "$f")\` ($(du -h "$f" | cut -f1))"
              done
              echo ""
              echo "Download the **screenshots** artifact below to view them."
            else
              echo "No screenshots produced — see the log above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit downscaled captures
        # Artifacts expire, need a login to download, and can't be viewed in
        # the browser. Downscaled copies in the repo can be linked from the
        # README and reviewed in a diff — you can see a layout regression
        # rather than being told about one.
        #
        # Full-resolution PNGs are ~1.8 MB each and would bloat history badly;
        # these are ~150 KB JPEGs, which is plenty to judge a layout by.
        # Not `success()`: when one tab dies the other four are still worth
        # having, and the screenshot of a screen that crashed is often the most
        # informative image in the set.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if [ ! -d screenshots ] || [ -z "$(ls -A screenshots 2>/dev/null)" ]; then
            echo "Nothing captured."
            exit 0
          fi
          mkdir -p docs/screenshots
          for f in screenshots/*.png; do
            out="docs/screenshots/$(basename "${f%.png}").jpg"
            # sips ships with macOS, so no extra tooling to install.
            sips -Z 900 -s format jpeg -s formatOptions 70 "$f" --out "$out" > /dev/null
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
            exit 0
          fi
          # [skip ci] matters: this push touches neither the workflow nor
          # LaunchOptions, so the paths filter wouldn't retrigger — but the
          # marker makes that explicit rather than incidental.
          git commit -m "Update screenshots [skip ci]"

          # A capture takes ~13 minutes, so a commit landing on the branch
          # while it runs is normal, not exceptional -- and it used to fail
          # the whole run at the last step, reporting "Screenshots: failure"
          # for a job whose every screenshot had rendered correctly. That is
          # the worst failure mode a visual check can have: it cries wolf
          # about the one signal nobody can reproduce locally.
          #
          # On rejection, re-point HEAD at the fetched branch tip and rebuild
          # the commit rather than rebasing. `reset --mixed` leaves the JPEGs
          # in the working tree, so re-adding them produces one clean commit
          # on top of whatever landed -- and it works on the shallow clone
          # `actions/checkout` gives us, which `git rebase` does not reliably.
          # No conflict is possible: the only paths involved are images this
          # job just generated.
          pushed=0
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              pushed=1
              break
            fi
            echo "Push rejected (attempt $attempt); rebuilding onto the branch tip."
            git fetch --depth=1 origin "${GITHUB_REF_NAME}" || break
            git reset --mixed "origin/${GITHUB_REF_NAME}" || break
            git add docs/screenshots
            if git diff --cached --quiet; then
              echo "Screenshots already current on the branch tip."
              pushed=1
              break
            fi
            git commit -m "Update screenshots [skip ci]"
          done
          if [ "$pushed" != "1" ]; then
            echo "::warning::Captures rendered but could not be committed; see the screenshots artifact."
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 30
          if-no-files-found: warn

  watch:
    name: Watch screenshots
    runs-on: macos-latest
    # After the phone capture rather than beside it. Both jobs commit their
    # renders to the same branch, and two pushes racing on one ref is a
    # conflict nobody needs; `always()` so a phone failure does not silence
    # the watch, which is the surface with no coverage to lose.
    needs: capture
    if: ${{ always() }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The watch had never been photographed -- not photographed badly, not
      # at all. Two things were missing and both are now in place: a scheme
      # naming the watch target, so `xcodebuild` can build for a watchOS
      # destination, and a demo path in `WatchLink`, so a simulator with no
      # paired phone has a snapshot to draw instead of its waiting state.
      #
      # One size to begin with. The audit asks for seven case sizes and that
      # is the right end state, but a capture that has never run once should
      # prove it can take a single picture before it is asked to take seven.
      # Every case size the runner offers, not one.
      #
      # A watch layout fails by case size in a way a phone layout does not:
      # the same view has to hold on a 40mm square and a 49mm Ultra, and the
      # numbers this app puts on screen are the things that stop fitting
      # first. One render proves the capture works; the set is what makes it
      # a regression check. Discovered rather than hard-coded, because runner
      # images add and drop device models between releases and a pinned list
      # would quietly photograph fewer and fewer sizes without ever failing.
      - name: List the watch simulators this runner has
        id: sims
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > devices.json
          python3 - <<'PYEOF' > sims.txt
          import json
          data = json.load(open("devices.json"))["devices"]
          seen = {}
          for runtime, devices in sorted(data.items()):
              if "watchOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and "Watch" in d["name"]:
                      # One entry per model name: a runner carrying the same
                      # watch on two runtimes would otherwise photograph it
                      # twice and prove nothing the second time.
                      seen[d["name"]] = d["udid"]
          if not seen:
              raise SystemExit("No watchOS simulator on this runner.")
          for name, udid in sorted(seen.items()):
              print(udid + "\t" + name)
          PYEOF
          echo "Found $(wc -l < sims.txt | tr -d ' ') watch case sizes:"
          cut -f2 sims.txt
          # The build needs one destination; any of them resolves the same
          # watchOS SDK, so the first is as good as any.
          echo "build_udid=$(head -1 sims.txt | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Build ZoonWatch
        run: |
          set -o pipefail
          xcodebuild build \
            -project Zoon.xcodeproj \
            -scheme ZoonWatch \
            -configuration Debug \
            -destination "id=${{ steps.sims.outputs.build_udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -20

      - name: Capture every case size
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products -maxdepth 3 -name "ZoonWatch.app" | head -1)
          [ -n "$APP" ] || { echo "No ZoonWatch.app was produced."; exit 1; }
          mkdir -p watch-screenshots

          FAILED=0
          # The page sweep runs on the first case size only -- see below.
          FIRST_CASE=1
          while IFS=$'\t' read -r UDID NAME; do
            # A slug that survives a rename: "Apple Watch Series 10 (42mm)"
            # becomes "series-10-42mm", so the committed filename tracks the
            # case rather than the marketing string.
            SLUG=$(echo "$NAME" \
              | sed -e 's/Apple Watch //' -e 's/[()]//g' \
              | tr '[:upper:] ' '[:lower:]-')
            echo "--- $NAME ($SLUG)"
            # One bad simulator must not lose the whole set: the point of
            # capturing every size is comparing them, and a run that fails at
            # the third of seven has photographed nothing useful.
            if ! xcrun simctl boot "$UDID" 2>/dev/null; then
              echo "::warning::Could not boot $NAME"; FAILED=1; continue
            fi
            xcrun simctl bootstatus "$UDID" -b || true
            xcrun simctl install "$UDID" "$APP" || { echo "::warning::install failed on $NAME"; FAILED=1; continue; }
            # `-zoonDemo YES` is the same flag the phone capture uses. Without
            # it the watch draws its waiting state and the picture proves
            # nothing.
            # `-zoonWatchPage lastNight` pins the deck. Without it the page
            # photographed is whichever one the hour selected, so a render
            # would change meaning depending on when CI ran.
            xcrun simctl launch "$UDID" com.zoon.sleep.watchkitapp \
              -zoonDemo YES -zoonWatchPage lastNight || true
            # No launch animation to wait out, but the first frame after
            # launch is not necessarily the settled one.
            sleep 8
            xcrun simctl io "$UDID" screenshot "watch-screenshots/$SLUG.png" \
              || { echo "::warning::screenshot failed on $NAME"; FAILED=1; }

            # The rest of the deck, on this one case only. Every page on
            # every size is a matrix that costs far more than it proves: a
            # page fails by size or it fails by content, and the sweep above
            # already covers the first. This covers the second.
            if [ "$FIRST_CASE" = "1" ]; then
              for PAGE in today tonight more log nap scoreLight; do
                xcrun simctl terminate "$UDID" com.zoon.sleep.watchkitapp 2>/dev/null || true
                xcrun simctl launch "$UDID" com.zoon.sleep.watchkitapp \
                  -zoonDemo YES -zoonWatchPage "$PAGE" || true
                sleep 6
                LOWER=$(echo "$PAGE" | tr '[:upper:]' '[:lower:]')
                xcrun simctl io "$UDID" screenshot "watch-screenshots/page-$LOWER.png" \
                  || echo "::warning::page $PAGE did not render"
              done
              FIRST_CASE=0
            fi
            # Shut each one down before the next: several booted watch
            # simulators at once is how a runner runs out of memory halfway
            # through a set.
            xcrun simctl shutdown "$UDID" || true
          done < sims.txt

          ls -la watch-screenshots
          [ -n "$(ls -A watch-screenshots)" ] || { echo "No watch renders at all."; exit 1; }
          [ "$FAILED" = "0" ] || echo "::warning::Some case sizes did not render; see warnings above."

      # Committed, not merely uploaded. An artifact cannot be looked at
      # without downloading it, and a render nobody looks at is the same as
      # no render -- which is how a whole platform went unexamined. The phone
      # captures land in `docs/screenshots` for exactly this reason.
      - name: Commit the watch render
        run: |
          set -euo pipefail
          mkdir -p docs/screenshots/watch
          # Downscaled the same way the phone renders are, so the repository
          # does not grow by a full-resolution PNG per run.
          for png in watch-screenshots/*.png; do
            base=$(basename "$png" .png)
            sips -Z 400 -s format jpeg -s formatOptions 70 \
              "$png" --out "docs/screenshots/watch/$base.jpg" >/dev/null
          done
          # The single-size render this job used to produce, now superseded by
          # the per-case-size set.
          rm -f docs/screenshots/watch/home.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/watch
          if git diff --cached --quiet; then
            echo "Watch render unchanged."
            exit 0
          fi
          git commit -m "Update watch screenshots [skip ci]"
          pushed=0
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              pushed=1
              break
            fi
            echo "Push rejected (attempt $attempt); rebuilding onto the branch tip."
            git fetch --depth=1 origin "${GITHUB_REF_NAME}" || break
            git reset --mixed "origin/${GITHUB_REF_NAME}" || break
            git add docs/screenshots/watch
            if git diff --cached --quiet; then
              echo "Watch render already current on the branch tip."
              pushed=1
              break
            fi
            git commit -m "Update watch screenshots [skip ci]"
          done
          if [ "$pushed" != "1" ]; then
            echo "::warning::Watch render captured but could not be committed; see the artifact."
          fi

      - name: Upload watch screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-screenshots
          path: watch-screenshots/
          retention-days: 30
          if-no-files-found: warn
